<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>루디트레이너</title>
<meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument, not a web page. Score fills the top on bare paper, one transport strip, two flat pads as the playing surface. One signal color. */
:root{
  --bg:#F3F3F0; --pad:#E6E6E2; --pad-press:#D8D8D3; --ink:#111214; --muted:#7B7C78; --rule:#D9D9D4; --raise:#FFFFFF;
  --signal:#F2481B; --ok:#4FB52A; --bad:#E2332A;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-latin:"Barlow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --pad:#1C1D20; --pad-press:#26282C; --ink:#EEEEEA; --muted:#85878B; --rule:#2B2D31; --raise:#1A1B1E;
  --signal:#FF5A2C; --ok:#86D44E; --bad:#FF5148; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111214; --pad:#1C1D20; --pad-press:#26282C; --ink:#EEEEEA; --muted:#85878B; --rule:#2B2D31; --raise:#1A1B1E;
  --signal:#FF5A2C; --ok:#86D44E; --bad:#FF5148; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 12px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.mark{font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mark svg{display:block}
.icon{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon:active{background:var(--pad)}
.modes{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.modes button{border:0;background:none;padding:8px 0 10px;font-size:14px;font-weight:500;color:var(--muted);position:relative}
.modes button[aria-selected="true"]{color:var(--ink);font-weight:600}
.modes button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}

/* 악보 */
.score{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.title-row{display:flex;align-items:center;gap:6px;min-width:0}
.pick{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;min-width:0;text-align:left}
.pick span{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick svg{flex:none;color:var(--muted)}
.title-row .icon{margin-left:auto;flex:none}
.meta{font:500 13px var(--f-latin);color:var(--muted);letter-spacing:.02em;margin-top:2px}
.meta b{font-weight:600;color:var(--ink)}
.songbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--raise);text-align:left;min-width:0}
.songbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.songbar .sm{font:500 13px var(--f-latin);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.songbar svg{flex:none;color:var(--muted)}
.staff-wrap{flex:1;min-height:0;overflow:auto;margin:6px -4px 0;display:flex;align-items:center}
#staff{display:block;margin:auto 0}
.beats{display:flex;justify-content:center;gap:14px;padding:6px 0 10px}
.beats i{width:10px;height:10px;border-radius:50%;background:var(--rule);transition:background .05s}
.beats i.on{background:var(--ink)}
.beats i.on.acc{background:var(--signal)}

.st{stroke:var(--ink);stroke-width:1}
.bl{stroke:var(--ink);stroke-width:1.2}
.ts{font:600 17px var(--f-num);fill:var(--ink);text-anchor:middle}
.head,.beam,.flag,.rest-dot,.dot{fill:var(--ink)}
.stem{stroke:var(--ink);stroke-width:1.3}
.rest{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rest.thin{stroke-width:1.4}
.acc{stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
.tup{font:italic 600 11px var(--f-latin);fill:var(--muted);text-anchor:middle}
.stk{font:600 13px var(--f-latin);fill:var(--muted);text-anchor:middle;letter-spacing:.02em}
.note .head,.note .stk{transition:fill .15s}
.note.ok .head,.note.ok .stk,.note.ok .dot{fill:var(--ok)}
.note.ok .stem{stroke:var(--ok)}
.note.bad .head,.note.bad .stk,.note.bad .dot{fill:var(--bad)}
.note.bad .stem{stroke:var(--bad)}
.cursor{fill:var(--signal);opacity:.9}

.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:300 120px/1 var(--f-num);color:var(--signal);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.overlay.msg{font:500 15px/1.6 var(--f-body);color:var(--ink);text-align:center;padding:24px;white-space:pre-line;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:94%;text-align:center}

/* 템포·재생 */
.transport{display:flex;align-items:center;gap:6px;height:76px;border-top:1px solid var(--rule)}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.step:active{background:var(--pad)}
.tempo{display:flex;align-items:baseline;gap:6px;min-width:0;padding:0 6px}
.tempo output{font:300 46px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:2.1ch;text-align:right}
.tempo span{font:600 12px var(--f-latin);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.play{margin-left:auto;width:60px;height:60px;border-radius:50%;border:0;background:var(--signal);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--signal) 35%,transparent)}
.play:active{transform:scale(.96)}
.play.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* 패드 */
.pads{flex:0 0 clamp(170px,33%,300px);display:flex;gap:8px;position:relative}
.pad{flex:1;min-width:0;border:0;border-radius:20px;background:var(--pad);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .06s,box-shadow .12s}
.pad b{font:300 64px/1 var(--f-num);color:var(--ink)}
.pad small{font-size:12px;color:var(--muted)}
.pad .hint{position:absolute;top:14px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:transparent;transition:background .08s}
.pad.next .hint{background:var(--signal)}
.pad.hit{background:var(--pad-press)}
.pad.okf{box-shadow:inset 0 0 0 3px var(--ok)}
.pad.badf{box-shadow:inset 0 0 0 3px var(--bad)}

/* 결과 */
.result{position:absolute;inset:0;z-index:2;background:var(--raise);border:1px solid var(--rule);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.res-top{display:flex;align-items:flex-end;gap:12px}
.res-score{font:300 54px/0.9 var(--f-num);font-variant-numeric:tabular-nums}
.res-score small{font-size:24px;margin-left:2px;color:var(--muted)}
.res-head{font-weight:600}
.res-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.res-list li{padding-left:14px;position:relative}
.res-list li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.res-list b{color:var(--bad);font-weight:600}
.res-actions{margin-top:auto;display:flex;gap:8px}

.btn{height:44px;border-radius:12px;border:1px solid var(--rule);background:transparent;padding:0 14px;font-weight:500;flex:1;display:grid;place-items:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn:active{transform:translateY(1px)}

/* 시트 */
.sheet-back{position:fixed;inset:0;z-index:10;background:rgb(0 0 0 / .38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:var(--raise);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--rule);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.txt{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 0}
.grp{font:600 11px var(--f-latin);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.list{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--rule)}
.opt span{flex:1;min-width:0;font-weight:500}
.opt small{font:500 13px var(--f-latin);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.opt svg{flex:none;visibility:hidden;color:var(--signal)}
.opt[aria-pressed="true"] span{font-weight:600}
.opt[aria-pressed="true"] svg{visibility:visible}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.field.col{flex-direction:column;align-items:stretch}
.field>span{font-weight:500}
.field>span small,.note{display:block;font-size:12px;color:var(--muted);font-weight:400;margin:0}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--rule);background:transparent;font:500 14px var(--f-latin)}
.ctl output{font:400 22px var(--f-num);font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:center}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;height:34px;min-width:40px;font:500 14px var(--f-latin);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--rule);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.sw:checked{background:var(--signal)}
.sw:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--signal);width:100%}
.row2{display:flex;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="9" r="3.2" fill="currentColor"/><circle cx="13" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      루디트레이너
    </div>
    <button class="icon" id="btnSettings" aria-label="연습 설정">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M3 6h14M3 14h14"/><circle cx="7.5" cy="6" r="2.2" fill="var(--bg)"/><circle cx="12.5" cy="14" r="2.2" fill="var(--bg)"/></g></svg>
    </button>
  </header>
  <nav class="modes" role="tablist" aria-label="연습 모드">
    <button role="tab" data-mode="rudiment" aria-selected="true">루디먼트</button>
    <button role="tab" data-mode="read" aria-selected="false">초견</button>
    <button role="tab" data-mode="song" aria-selected="false">노래</button>
  </nav>

  <section class="score" id="score" aria-label="악보">
    <div class="title-row">
      <button class="pick" id="pickPattern" aria-label="패턴 고르기"><span id="patName"></span>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="btnNew" aria-label="새 패턴 만들기" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="meta" id="patMeta"></div>
    <button class="songbar" id="songBar" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 13.5V3.5l8-1.5v10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><circle cx="5" cy="13.5" r="2" fill="currentColor"/><circle cx="13" cy="12" r="2" fill="currentColor"/></svg>
      <span class="nm" id="songName">노래 고르기</span><span class="sm" id="songMeta"></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="staff-wrap" id="staffWrap"><svg id="staff" role="img" aria-label="드럼 악보"></svg></div>
    <div class="beats" id="beats" aria-hidden="true"><i class="acc"></i><i></i><i></i><i></i></div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </section>

  <section class="transport">
    <button class="step" id="bpmDown" aria-label="느리게"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="tempo"><output id="bpmOut">80</output><span id="bpmUnit">BPM</span></div>
    <button class="step" id="bpmUp" aria-label="빠르게"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="play" id="btnPlay" aria-label="시작"></button>
  </section>

  <section class="pads">
    <button class="pad" id="padL" aria-label="왼손 패드 (키보드 F)"><span class="hint"></span><b>L</b><small>왼손</small></button>
    <button class="pad" id="padR" aria-label="오른손 패드 (키보드 J)"><span class="hint"></span><b>R</b><small>오른손</small></button>
    <div class="result" id="result" hidden></div>
  </section>
</div>

<input type="file" id="fileSong" accept="audio/*" class="vh" tabindex="-1" aria-hidden="true">
<div class="sheet-back" id="sheet" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const r1=v=>Math.round(v*10)/10;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const store={
  get(k,d){try{const v=localStorage.getItem('rudi.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('rudi.'+k,JSON.stringify(v))}catch(e){}}
};

const S={mode:'rudiment',bpm:store.get('bpm',80),reps:store.get('reps',2),
  rud:'para',level:2,songPat:'r:single8',
  metro:store.get('metro',true),guide:store.get('guide',false),hint:store.get('hint',true),
  speedup:store.get('speedup',false),lat:store.get('lat',0.04)};

const ICON={
  play:'<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M7 4.5v13l11-6.5z" fill="currentColor"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="2" fill="currentColor"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 9.5l3.2 3L14 5.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};

/* ---------- 패턴 ---------- */
// cyc: 한 사이클의 스티킹('-'는 쉼표), sub: 한 박을 몇 칸으로 나누는지
const RUD=[
  {id:'single8', name:'싱글 스트로크 8분', sub:2, cyc:'RL', acc:[]},
  {id:'single16',name:'싱글 스트로크 16분',sub:4, cyc:'RL', acc:[]},
  {id:'double',  name:'더블 스트로크',      sub:4, cyc:'RRLL', acc:[]},
  {id:'para',    name:'싱글 패러디들',      sub:4, cyc:'RLRRLRLL', acc:[0,4]},
  {id:'dblpara', name:'더블 패러디들',      sub:3, cyc:'RLRLRRLRLRLL', acc:[0,6]},
  {id:'pdd',     name:'패러디들디들',       sub:3, cyc:'RLRRLL', acc:[0]},
  {id:'trip',    name:'셋잇단 싱글',        sub:3, cyc:'RLRLRL', acc:[0,3]},
  {id:'five',    name:'5스트로크 롤',       sub:4, cyc:'RRLLR---LLRRL---', acc:[4,12]},
];
const LV=[
  {id:1,name:'레벨 1',desc:'4분음표',          sub:1,p:.75,stick:'alt'},
  {id:2,name:'레벨 2',desc:'8분음표',          sub:2,p:.7, stick:'nat'},
  {id:3,name:'레벨 3',desc:'16분음표',         sub:4,p:.6, stick:'nat'},
  {id:4,name:'레벨 4',desc:'16분 스티킹 섞기',  sub:4,p:1,  stick:'mix'},
  {id:5,name:'레벨 5',desc:'셋잇단',           sub:3,p:.7, stick:'alt'},
];
const SUBNAME={1:'4분음표',2:'8분음표',3:'셋잇단',4:'16분음표'};
const BARS=2;
const stickPreview=r=>{const s=r.cyc.replace(/-/g,'·'),k=r.sub===2?4:r.sub,out=[];for(let i=0;i<s.length&&out.length<4;i+=k)out.push(s.slice(i,i+k));return out.join(' ')};

function buildRud(id){
  const r=RUD.find(x=>x.id===id)||RUD[0],n=BARS*4*r.sub,slots=[];
  for(let j=0;j<n;j++){const c=r.cyc[j%r.cyc.length];slots.push(c==='-'?null:{h:c,acc:r.acc.includes(j%r.cyc.length)})}
  return {name:r.name,sub:r.sub,bars:BARS,slots};
}
function genPattern(id){
  const L=LV.find(x=>x.id===id)||LV[0],sub=L.sub,n=BARS*4*sub;
  let slots=[];
  for(let t=0;t<40;t++){
    slots=[];
    for(let j=0;j<n;j++){const p=L.p*(j%sub===0?1.15:0.92);slots.push(Math.random()<p?{h:'R',acc:false}:null)}
    if(!slots[0])slots[0]={h:'R',acc:false};
    const c=slots.filter(Boolean).length;
    if(L.p>=1||(c>=n*L.p*0.85&&c<n))break;
  }

function analyze(buf){
  const sr=buf.sampleRate,hop=Math.round(sr*.005),hopS=hop/sr;
  const c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):null;
  const n=Math.floor(Math.min(buf.length,sr*120)/hop);
  const E=new Float32Array(n),EL=new Float32Array(n),on=new Float32Array(n),lo=new Float32Array(n);
  const a=1-Math.exp(-2*Math.PI*150/sr);let y=0,mE=0,mL=0;
  for(let f=0;f<n;f++){
    let s=0,sl=0;const st=f*hop;
    for(let k=0;k<hop;k++){let x=c0[st+k];if(c1)x=(x+c1[st+k])*.5;s+=x*x;y+=a*(x-y);sl+=y*y}
    E[f]=s;EL[f]=sl;mE+=s;mL+=sl;
  }
  mE=mE/n*.05+1e-12;mL=mL/n*.05+1e-12;
  // 곡 전체 음량 대비로 압축한 에너지가 갑자기 커지는 지점 = 타격 지점
  for(let f=1;f<n;f++){
    on[f]=Math.max(0,Math.log1p(E[f]/mE)-Math.log1p(E[f-1]/mE));
    lo[f]=Math.max(0,Math.log1p(EL[f]/mL)-Math.log1p(EL[f-1]/mL));
  }
  // 1) 자기상관으로 대략적인 템포
  const minLag=Math.floor(60/200/hopS),maxLag=Math.ceil(60/60/hopS);
  let bestLag=minLag,bestV=-1;
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0;for(let f=lag;f<n;f++)s+=on[f]*on[f-lag];
    const bpm=60/(lag*hopS),w=Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.8,2));
    if(s*w>bestV){bestV=s*w;bestLag=lag}
  }
  // 2) 2배·절반·3:2 후보까지 박 격자를 미세하게 맞춰보고, 박 위치의 평균 세기가 가장 큰 템포를 고르기
  const coarse=60/(bestLag*hopS),cands=[];
  [1,2,.5,1.5,2/3,4/3,.75].forEach(m=>{const b=coarse*m;if(b>=70&&b<=180&&!cands.some(c=>Math.abs(c/b-1)<.03))cands.push(b)});
  let best=null;
  for(const c of cands){
    let cb={s:-1};
    for(let b=c*.97;b<=c*1.03;b+=.05){
      const P=60/b/hopS;
      for(let ph=0;ph<P;ph+=1){
        let s=0,cnt=0;for(let x=ph;x<n-1;x+=P){const i=Math.round(x);s+=on[i]+.5*((on[i-1]||0)+on[i+1]);cnt++}
        s/=cnt||1;if(s>cb.s)cb={s,b,ph,P};
      }
    }
    cb.score=cb.s*Math.exp(-.5*Math.pow(Math.log2(cb.b/115)/.9,2));
    if(!best||cb.score>best.score)best=cb;
  }
  if(!best)best={b:120,ph:0,P:60/120/hopS};
  // 3) 저음(킥)이 가장 강한 박을 1박으로
  let bj=0,bs=-1;
  for(let j=0;j<4;j++){let s=0;for(let x=best.ph+j*best.P;x<n;x+=4*best.P)s+=lo[Math.round(x)]||0;if(s>bs){bs=s;bj=j}}
  return {bpm:Math.round(best.b*10)/10,off:(best.ph+bj*best.P)*hopS};
}
async function makeDemo(){
  const sr=44100,bpm=96,spb=60/bpm,intro=.42,bars=24,dur=intro+bars*4*spb+1;

  const env=(t,v,len)=>{const g=oc.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);g.connect(oc.destination);return g};
  const kick=t=>{const o=oc.createOscillator();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);o.connect(env(t,.95,.32));o.start(t);o.stop(t+.33)};

}

  ensureAudio();
  const d=ts!=null?(performance.now()-ts)/1000:0,at=ctx.currentTime-(d>=0&&d<.1?d:0);
  playHit(ctx.currentTime,hand,.6,false);padFx(hand,'hit');
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  if(calib){calib.taps.push(at);return}
  const R=run;if(!R)return;
  const tap=at-S.lat;let best=null,bd=1e9;
  for(let k=Math.max(0,R.scan-4);k<R.events.length;k++){
    const e=R.events[k];if(e.t-R.win>tap)break;if(e.st)continue;
    const dd=Math.abs(tap-e.t);if(dd<=R.win&&dd<bd){bd=dd;best=e}
  }
  if(!best){R.extra++;padFx(hand,'badf');return}
  best.err=tap-best.t;best.tapH=hand;
  if(best.h!==hand){best.st='bad';best.why='hand'}
  else if(Math.abs(best.err)>R.good){best.st='bad';best.why=best.err<0?'early':'late'}
  else best.st='ok';
  if(best.rep===R.shown)paint(best);
  padFx(hand,best.st==='ok'?'okf':'badf');
}
function finish(show){
  const R=run;if(!R)return;run=null;
  clearInterval(R.timer);cancelAnimationFrame(R.raf);
  if(R.src){R.src.onended=null;try{R.src.stop()}catch(e){}}
  releaseWake();hideCursors();setNext(null);overlay('');lightBeat(-1);setPlayBtn(false);
  clearPaint();
  if(!show)return;
  const ev=R.events.filter(e=>e.st);if(ev.length<4)return;
  showResult(R,ev);
}

/* ---------- 결과와 진단 ---------- */
function showResult(R,ev){
  const notes=cur.notes,N=notes.length;
  const ok=ev.filter(e=>e.st==='ok').length,pct=Math.round(100*ok/ev.length);
  const cnt=w=>ev.filter(e=>e.why===w).length;
  const lines=[];
  ['L','R'].forEach(hd=>{
    const a=ev.filter(e=>e.err!=null&&e.tapH===e.h&&e.h===hd);if(a.length<3)return;
    const m=a.reduce((s,e)=>s+e.err,0)/a.length*1000,nm=hd==='L'?'왼손':'오른손';
    if(m>=12)lines.push(`${nm}이 평균 <b>${Math.round(m)}ms 늦어요</b>`);
    else if(m<=-12)lines.push(`${nm}이 평균 <b>${Math.round(-m)}ms 빨라요</b>`);
    else lines.push(`${nm} 타이밍은 안정적이에요 (평균 ${m>=0?'+':''}${Math.round(m)}ms)`);
  });
  const TR={RR:'오른손 더블(R R)에서',LL:'왼손 더블(L L)에서',RL:'R → L로 넘어갈 때',LR:'L → R로 넘어갈 때'};
  const tr={};
  ev.forEach(e=>{const k=notes[(e.i-1+N)%N].h+e.h;(tr[k]=tr[k]||{t:0,b:0}).t++;if(e.st==='bad')tr[k].b++});
  const worst=Object.entries(tr).filter(([,v])=>v.t>=3&&v.b>0).sort((a,b)=>b[1].b/b[1].t-a[1].b/a[1].t)[0];
  if(worst&&worst[1].b/worst[1].t>=.25)lines.push(`${TR[worst[0]]} <b>자주 틀려요</b> (${worst[1].t}번 중 ${worst[1].b}번)`);
  const lc={};ev.forEach(e=>{if(e.st==='bad'){const n=notes[e.i],k=n.bar*4+n.beat;lc[k]=(lc[k]||0)+1}});
  const top=Object.entries(lc).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=2){const k=+top[0];lines.push(`${Math.floor(k/4)+1}마디 ${k%4+1}박이 가장 어려웠어요`)}
  if(S.speedup&&S.mode!=='song'&&pct>=90){S.bpm=clamp(S.bpm+5,30,220);store.set('bpm',S.bpm);updateTempo();lines.push(`다음 연습은 ${S.bpm} BPM으로 올렸어요`)}
  const head=pct>=95?'완벽해요':pct>=80?'좋아요':pct>=60?'조금만 더':'템포를 낮춰 보세요';
  const el=$('#result');
  el.innerHTML=`<div class="res-top"><div class="res-score">${pct}<small>%</small></div><div><div class="res-head">${head}</div><div class="res-sub">${ev.length}음 중 ${ok}음 정확</div></div></div>`+
    `<ul class="res-list">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`+
    `<div class="res-sub">손 순서 ${cnt('hand')} · 빠름 ${cnt('early')} · 늦음 ${cnt('late')} · 놓침 ${cnt('miss')} · 헛침 ${R.extra}</div>`+
    `<div class="res-actions"><button class="btn" data-act="close">닫기</button>${cur.pattern.gen?'<button class="btn" data-act="new">새 패턴</button>':''}<button class="btn primary" data-act="again">다시 하기</button></div>`;
  el.hidden=false;
  // 악보를 처음부터 다시 훑으며 음표마다 결과 색을 칠해요
  const agg=notes.map(()=>({t:0,o:0}));ev.forEach(e=>{agg[e.i].t++;if(e.st==='ok')agg[e.i].o++});
  const step=Math.min(70,1600/N);
  notes.forEach((n,k)=>{const a=agg[k];if(!a.t)return;
    setTimeout(()=>{const nel=noteEls[k];if(nel&&!run)nel.classList.add(a.o/a.t>=.8?'ok':'bad');
      const b=n.bar;if(!run&&geo[b])moveCursor(b,geo[b].xOf(n.pos));if(k===N-1)setTimeout(()=>{if(!run)hideCursors()},300)},150+k*step)});
}
function hideResult(){$('#result').hidden=true}
$('#result').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='close'){hideResult();clearPaint()}
  else if(a.dataset.act==='new'){setPattern(patternForMode())}
  else{clearPaint();startRun()}
});

/* ---------- 지연 보정 ---------- */
function startCalib(){
  ensureAudio();finish(false);closeSheet();hideResult();
  const spb=.6,t0=ctx.currentTime+.4,clicks=[];
  for(let k=0;k<12;k++){clicks.push(t0+k*spb);playClick(t0+k*spb,k%4===0)}
  calib={clicks,taps:[]};
  overlay('클릭 4번을 듣고, 이어지는 8번의 클릭에 맞춰\n아무 패드나 쳐 주세요',true);
  setTimeout(()=>{
    const C=calib;calib=null;overlay('');
    const ds=[];C.taps.forEach(tp=>{let b=null;C.clicks.slice(4).forEach(c=>{const d=tp-c;if(Math.abs(d)<.28&&(b==null||Math.abs(d)<Math.abs(b)))b=d});if(b!=null)ds.push(b)});
    if(ds.length<4){toast('탭이 부족해요. 다시 해 주세요');return}
    ds.sort((a,b)=>a-b);S.lat=clamp(ds[Math.floor(ds.length/2)],-.05,.3);store.set('lat',S.lat);
    toast(`보정 완료 · ${Math.round(S.lat*1000)}ms`);
  },(.4+12*spb+.5)*1000);
}

/* ---------- 시트 ---------- */
let sheetKind='';
function openSheet(kind,html,wire){
  sheetKind=kind;const b=$('#sheetBody');b.innerHTML=html;$('#sheet').hidden=false;
  b.querySelectorAll('[data-close]').forEach(x=>x.addEventListener('click',closeSheet));
  wire&&wire(b);
}
function closeSheet(){$('#sheet').hidden=true;sheetKind=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
const head=t=>`<div class="sheet-head"><h2>${t}</h2><button class="txt" data-close>닫기</button></div>`;

function openPicker(){
  let groups,current;
  if(S.mode==='rudiment'){groups=[{items:RUD.map(r=>({v:r.id,l:r.name,s:stickPreview(r)}))}];current=S.rud}
  else if(S.mode==='read'){groups=[{items:LV.map(l=>({v:String(l.id),l:l.name,s:l.desc}))}];current=String(S.level)}
  else{groups=[{label:'루디먼트',items:RUD.map(r=>({v:'r:'+r.id,l:r.name,s:stickPreview(r)}))},{label:'초견 자동 생성',items:LV.map(l=>({v:'l:'+l.id,l:l.name,s:l.desc}))}];current=S.songPat}
  const html=head(S.mode==='read'?'초견 레벨':'패턴')+groups.map(g=>(g.label?`<div class="grp">${g.label}</div>`:'')+
    `<div class="list">${g.items.map(it=>`<button class="opt" data-v="${it.v}" aria-pressed="${it.v===current}"><span>${it.l}</span><small>${it.s}</small>${ICON.check}</button>`).join('')}</div>`).join('');
  openSheet('pick',html,b=>b.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{
    const v=o.dataset.v;finish(false);
    if(S.mode==='rudiment')S.rud=v;else if(S.mode==='read')S.level=+v;else S.songPat=v;
    closeSheet();applyMode();setPattern(patternForMode());
  })));
}
function openSettings(){
  const sw=(id,on,t,s)=>`<label class="field"><span>${t}<small>${s}</small></span><input type="checkbox" class="sw" id="${id}"${on?' checked':''}></label>`;
  const html=head('연습 설정')+
    `<div class="field"><span>반복<small>노래 모드에서는 곡 끝까지</small></span><div class="seg" id="segReps">${[1,2,4,8,0].map(v=>`<button data-v="${v}" aria-pressed="${S.reps===v}">${v||'∞'}</button>`).join('')}</div></div>`+
    sw('optMetro',S.metro,'메트로놈 클릭','시작 전 카운트 4번은 항상 들려요')+
    sw('optGuide',S.guide,'패턴 소리 같이 듣기','쳐야 할 음을 앱이 작게 같이 쳐줘요')+
    sw('optHint',S.hint,'다음 손 힌트','다음에 칠 패드에 점이 켜져요')+
    sw('optSpeed',S.speedup,'스피드 빌더','정확도 90% 이상이면 다음 연습은 +5 BPM')+
    `<div class="field col"><span>터치 지연 보정 <output id="latOut" style="float:right;font-family:var(--f-latin)">${Math.round(S.lat*1000)}ms</output><small>박자에 맞게 쳤는데도 계속 '늦음'으로 나오면 보정하세요</small></span>`+
    `<input type="range" id="latRange" min="-50" max="300" step="5" value="${Math.round(S.lat*1000)}" aria-label="지연 보정 값"><button class="btn" id="btnCalib">클릭 듣고 자동 보정</button></div>`;
  openSheet('settings',html,b=>{
    b.querySelectorAll('#segReps button').forEach(x=>x.addEventListener('click',()=>{S.reps=+x.dataset.v;store.set('reps',S.reps);b.querySelectorAll('#segReps button').forEach(y=>y.setAttribute('aria-pressed',String(y===x)))}));
    [['optMetro','metro'],['optGuide','guide'],['optHint','hint'],['optSpeed','speedup']].forEach(([id,k])=>{
      const el=b.querySelector('#'+id);el.addEventListener('change',()=>{S[k]=el.checked;store.set(k,S[k]);if(k==='hint'&&!S.hint)setNext(null)});
    });
    b.querySelector('#latRange').addEventListener('input',e=>{S.lat=+e.target.value/1000;store.set('lat',S.lat);b.querySelector('#latOut').textContent=Math.round(S.lat*1000)+'ms'});
    b.querySelector('#btnCalib').addEventListener('click',startCalib);
  });
}
function openSongSheet(){
  let html=head('노래')+
    `<div class="row2"><label class="btn primary" for="fileSong">파일 선택</label><button class="btn" id="btnDemo">예시 비트</button></div>`+
    `<p class="note" id="songStatus">mp3·m4a 파일을 고르면 박자를 자동으로 찾아요. 파일은 이 기기 안에서만 재생돼요.</p>`;
  if(song.buf){
    html+=`<div class="field"><span>${song.name}<small>${fmtT(song.buf.duration)}</small></span></div>`+
      `<div class="field"><span>곡 템포</span><div class="ctl"><button id="sbDown">−</button><output id="sbOut">${song.bpm.toFixed(1)}</output><button id="sbUp">+</button><button id="sbHalf">½</button><button id="sbDbl">×2</button></div></div>`+
      `<div class="field"><span>첫 박 위치<small>클릭의 1박이 노래와 다르면</small></span><div class="ctl"><button id="offPrev">‹ 한 박</button><button id="offNext">한 박 ›</button></div></div>`+
      `<div class="field"><span>싱크<small><span id="offOut">${song.off.toFixed(2)}</span>초</small></span><div class="ctl"><button id="nudgeL">−10ms</button><button id="nudgeR">+10ms</button></div></div>`+
      `<div class="field col"><span>시작 위치 <output id="songStartOut" style="float:right;font-family:var(--f-latin)">${fmtT(song.startAt)}</output></span><input type="range" id="songStart" min="0" max="${Math.max(0,Math.floor(song.buf.duration-10))}" step="1" value="${song.startAt}" aria-label="시작 위치"></div>`;
  }
  openSheet('song',html,b=>{
    b.querySelector('#btnDemo').addEventListener('click',async()=>{
      finish(false);ensureAudio();b.querySelector('#songStatus').textContent='예시 비트를 만드는 중…';
      try{const buf=await makeDemo();setSong(buf,'예시 비트')}catch(err){b.querySelector('#songStatus').textContent='예시 비트를 만들지 못했어요'}
    });
    if(!song.buf)return;
    const adj=fn=>()=>{finish(false);fn();normOff();songUI();updateTempo();
      b.querySelector('#sbOut').textContent=song.bpm.toFixed(1);b.querySelector('#offOut').textContent=song.off.toFixed(2)};
    b.querySelector('#sbDown').addEventListener('click',adj(()=>{song.bpm=clamp(Math.round((song.bpm-.5)*10)/10,40,240)}));
    b.querySelector('#sbUp').addEventListener('click',adj(()=>{song.bpm=clamp(Math.round((song.bpm+.5)*10)/10,40,240)}));
    b.querySelector('#sbHalf').addEventListener('click',adj(()=>{song.bpm=clamp(song.bpm/2,40,240)}));
    b.querySelector('#sbDbl').addEventListener('click',adj(()=>{song.bpm=clamp(song.bpm*2,40,240)}));
    b.querySelector('#offPrev').addEventListener('click',adj(()=>{song.off-=60/song.bpm}));
    b.querySelector('#offNext').addEventListener('click',adj(()=>{song.off+=60/song.bpm}));
    b.querySelector('#nudgeL').addEventListener('click',adj(()=>{song.off-=.01}));
    b.querySelector('#nudgeR').addEventListener('click',adj(()=>{song.off+=.01}));
    b.querySelector('#songStart').addEventListener('input',e=>{finish(false);song.startAt=+e.target.value;b.querySelector('#songStartOut').textContent=fmtT(song.startAt)});
  });
}

/* ---------- UI ---------- */
const padL=$('#padL'),padR=$('#padR');
function padFx(hand,cls){
  const p=hand==='L'?padL:padR;
  if(cls!=='hit')p.classList.remove(cls==='okf'?'badf':'okf');
  p.classList.remove(cls);void p.offsetWidth;p.classList.add(cls);
  clearTimeout(p['_t'+cls]);p['_t'+cls]=setTimeout(()=>p.classList.remove(cls),cls==='hit'?90:220);
}
function setNext(h){padL.classList.toggle('next',h==='L');padR.classList.toggle('next',h==='R')}
function overlay(t,msg){const o=$('#overlay');o.textContent=t;o.className='overlay'+(msg?' msg':'');o.hidden=!t}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2800)}
function updateTempo(){
  if(S.mode==='song'){
    $('#bpmOut').textContent=song.buf?Math.round(song.bpm*song.rate):'—';
    $('#bpmUnit').textContent=`BPM · ${Math.round(song.rate*100)}%`;
  }else{$('#bpmOut').textContent=S.bpm;$('#bpmUnit').textContent='BPM'}
}
const bump=d=>{
  if(S.mode==='song'){finish(false);song.rate=clamp(Math.round((song.rate+d/50)*10)/10,.5,1)}
  else{S.bpm=clamp(S.bpm+d,30,220);store.set('bpm',S.bpm);if(run)toast('바뀐 템포는 다음 시작부터 적용돼요')}
  updateTempo();
};

[['L',padL],['R',padR]].forEach(([h,p])=>{
  p.addEventListener('pointerdown',e=>{e.preventDefault();hit(h,e.timeStamp)});
  p.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('keydown',e=>{
  if(e.repeat||e.target.tagName==='INPUT'||!$('#sheet').hidden)return;
  const k=e.key.toLowerCase();
  if(k==='f'||k==='d'||k==='arrowleft'){e.preventDefault();hit('L',e.timeStamp)}
  else if(k==='j'||k==='k'||k==='arrowright'){e.preventDefault();hit('R',e.timeStamp)}
  else if(k===' '){e.preventDefault();$('#btnPlay').click()}
});

function patternForMode(){
  if(S.mode==='rudiment')return buildRud(S.rud);
  if(S.mode==='read')return genPattern(S.level);
  return S.songPat.startsWith('l:')?genPattern(+S.songPat.slice(2)):buildRud(S.songPat.slice(2));
}
function applyMode(){
  const m=S.mode;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===m)));
  $('#songBar').hidden=m!=='song';
  $('#btnNew').hidden=!(m==='read'||(m==='song'&&S.songPat.startsWith('l:')));
  updateTempo();
}
function changeMode(m){finish(false);closeSheet();S.mode=m;applyMode();setPattern(patternForMode())}

document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>changeMode(b.dataset.mode)));
$('#pickPattern').addEventListener('click',openPicker);
$('#btnNew').addEventListener('click',()=>{finish(false);setPattern(patternForMode())});
$('#songBar').addEventListener('click',openSongSheet);
$('#btnSettings').addEventListener('click',openSettings);
$('#bpmDown').addEventListener('click',()=>bump(-5));
$('#bpmUp').addEventListener('click',()=>bump(5));
$('#btnPlay').addEventListener('click',()=>{if(calib)return;if(run)finish(true);else startRun()});
$('#fileSong').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  finish(false);ensureAudio();
  const st=document.querySelector('#songStatus');if(st)st.textContent='박자를 분석하는 중…';
  try{
    const ab=await f.arrayBuffer();
    const buf=await new Promise((res,rej)=>ctx.decodeAudioData(ab,res,rej));
    setTimeout(()=>setSong(buf,f.name.replace(/\.[^.]+$/,'')),20);
  }catch(err){const s2=document.querySelector('#songStatus');if(s2)s2.textContent='이 파일은 재생할 수 없어요. mp3나 m4a로 시도해 보세요'}
  e.target.value='';
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)finish(false)});

let lastW=0;
new ResizeObserver(()=>{const w=$('#staffWrap').clientWidth;if(Math.abs(w-lastW)>2){lastW=w;renderStaff();if(run)run.shown=-2}}).observe($('#staffWrap'));

setPlayBtn(false);songUI();applyMode();setPattern(patternForMode());
})();
</script>
