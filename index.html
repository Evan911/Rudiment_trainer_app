<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>루디트레이너</title>
<meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument, not a web page. Score fills the top on bare paper, one transport strip, two flat pads as the playing surface. One signal color. */
:root{
  --bg:#F3F3F0; --pad:#E6E6E2; --pad-press:#D8D8D3; --ink:#111214; --muted:#7B7C78; --rule:#D9D9D4; --raise:#FFFFFF;
  --signal:#F2481B; --ok:#4FB52A; --bad:#E2332A;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-latin:"Barlow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111214; --pad:#1C1D20; --pad-press:#26282C; --ink:#EEEEEA; --muted:#85878B; --rule:#2B2D31; --raise:#1A1B1E;
  --signal:#FF5A2C; --ok:#86D44E; --bad:#FF5148; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111214; --pad:#1C1D20; --pad-press:#26282C; --ink:#EEEEEA; --muted:#85878B; --rule:#2B2D31; --raise:#1A1B1E;
  --signal:#FF5A2C; --ok:#86D44E; --bad:#FF5148; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 12px}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.mark{font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.mark svg{display:block}
.icon{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon:active{background:var(--pad)}
.modes{display:flex;gap:22px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.modes button{border:0;background:none;padding:8px 0 10px;font-size:14px;font-weight:500;color:var(--muted);position:relative}
.modes button[aria-selected="true"]{color:var(--ink);font-weight:600}
.modes button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--ink)}

/* 악보 */
.score{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;overflow:hidden}
.title-row{display:flex;align-items:center;gap:6px;min-width:0}
.pick{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;min-width:0;text-align:left}
.pick span{font-size:22px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick svg{flex:none;color:var(--muted)}
.title-row .icon{margin-left:auto;flex:none}
.meta{font:500 13px var(--f-latin);color:var(--muted);letter-spacing:.02em;margin-top:2px}
.meta b{font-weight:600;color:var(--ink)}
.songbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:12px;background:var(--raise);text-align:left;min-width:0}
.songbar .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.songbar .sm{font:500 13px var(--f-latin);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.songbar svg{flex:none;color:var(--muted)}
.staff-wrap{flex:1;min-height:0;overflow:auto;margin:6px -4px 0;display:flex;align-items:center}
#staff{display:block;margin:auto 0}
.beats{display:flex;justify-content:center;gap:14px;padding:6px 0 10px}
.beats i{width:10px;height:10px;border-radius:50%;background:var(--rule);transition:background .05s}
.beats i.on{background:var(--ink)}
.beats i.on.acc{background:var(--signal)}

.st{stroke:var(--ink);stroke-width:1}
.bl{stroke:var(--ink);stroke-width:1.2}
.ts{font:600 17px var(--f-num);fill:var(--ink);text-anchor:middle}
.head,.beam,.flag,.rest-dot,.dot{fill:var(--ink)}
.stem{stroke:var(--ink);stroke-width:1.3}
.rest{stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rest.thin{stroke-width:1.4}
.acc{stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
.tup{font:italic 600 11px var(--f-latin);fill:var(--muted);text-anchor:middle}
.stk{font:600 13px var(--f-latin);fill:var(--muted);text-anchor:middle;letter-spacing:.02em}
.note .head,.note .stk{transition:fill .15s}
.stem.gs{stroke-width:1}
.stk.gr{font-size:9.5px}
.note.ok .head,.note.ok .stk,.note.ok .dot{fill:var(--ok)}
.note.ok .stem{stroke:var(--ok)}
.note.bad .head,.note.bad .stk,.note.bad .dot{fill:var(--bad)}
.note.bad .stem{stroke:var(--bad)}
.cursor{fill:var(--signal);opacity:.9}
.staff-wrap.kit{overflow-x:hidden;overflow-y:auto;align-items:flex-start;scrollbar-width:none;cursor:pointer;margin-top:4px}
.staff-wrap.kit::-webkit-scrollbar{display:none}
.staff-wrap.kit #staff{flex:none;margin:0}
.kit-x{stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;fill:none}
.kit-o{stroke:var(--ink);stroke-width:1.2;fill:none}
.note.ok .kit-x,.note.ok .kit-o{stroke:var(--ok)}
.note.bad .kit-x,.note.bad .kit-o{stroke:var(--bad)}
.ghost{font:400 13px var(--f-latin);fill:var(--ink)}
.barno{font:500 10px var(--f-latin);fill:var(--muted)}
.sect{font:600 12px var(--f-body);fill:var(--ink)}
.tempo-mk{font:600 11px var(--f-latin);fill:var(--signal)}
.startmark{fill:var(--signal);opacity:.08}
.opt-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule)}
.opt-row .opt{flex:1;border-bottom:0}

.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:300 120px/1 var(--f-num);color:var(--signal);background:color-mix(in srgb,var(--bg) 70%,transparent)}
.overlay.msg{font:500 15px/1.6 var(--f-body);color:var(--ink);text-align:center;padding:24px;white-space:pre-line;background:color-mix(in srgb,var(--bg) 92%,transparent)}
.toast{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;max-width:94%;text-align:center}

/* 템포·재생 */
.transport{display:flex;align-items:center;gap:6px;height:76px;border-top:1px solid var(--rule)}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:transparent;display:grid;place-items:center;color:var(--ink);flex:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.step:active{background:var(--pad)}
.tempo{display:flex;align-items:baseline;gap:6px;min-width:0;padding:0 6px}
.tempo output{font:300 46px/1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em;min-width:2.1ch;text-align:right}
.tempo span{font:600 12px var(--f-latin);letter-spacing:.08em;color:var(--muted);white-space:nowrap}
.play{margin-left:auto;width:60px;height:60px;border-radius:50%;border:0;background:var(--signal);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 14px color-mix(in srgb,var(--signal) 35%,transparent)}
.play:active{transform:scale(.96)}
.play.on{background:var(--ink);color:var(--bg);box-shadow:none}

/* 패드 */
.pads{flex:0 0 clamp(170px,33%,300px);display:flex;gap:8px;position:relative}
.pad{flex:1;min-width:0;border:0;border-radius:20px;background:var(--pad);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .12s,box-shadow .12s}
.pad b{font:300 64px/1 var(--f-num);color:var(--ink)}
.pad small{font-size:12px;color:var(--muted)}
.pad .hint{position:absolute;top:14px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:transparent;transition:background .08s}
.pad.next .hint{background:var(--signal)}
.pad.hit{background:var(--pad-press);transition:none}
.pad.okf{box-shadow:inset 0 0 0 3px var(--ok)}
.pad.badf{box-shadow:inset 0 0 0 3px var(--bad)}

/* 결과 */
.result{position:absolute;inset:0;z-index:2;background:var(--raise);border:1px solid var(--rule);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.res-top{display:flex;align-items:flex-end;gap:12px}
.res-score{font:300 54px/0.9 var(--f-num);font-variant-numeric:tabular-nums}
.res-score small{font-size:24px;margin-left:2px;color:var(--muted)}
.res-head{font-weight:600}
.res-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.res-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.res-list li{padding-left:14px;position:relative}
.res-list li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.res-list b{color:var(--bad);font-weight:600}
.res-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}

.btn{height:44px;border-radius:12px;border:1px solid var(--rule);background:transparent;padding:0 14px;font-weight:500;flex:1;display:grid;place-items:center}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.btn:active{transform:translateY(1px)}

/* 시트 */
.sheet-back{position:fixed;inset:0;z-index:10;background:rgb(0 0 0 / .38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:86%;overflow:auto;background:var(--raise);border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px;
  padding-top:10px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--rule);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.txt{border:0;background:none;color:var(--muted);font-size:14px;padding:6px 0}
.grp{font:600 11px var(--f-latin);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.list{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:12px 0;border-bottom:1px solid var(--rule)}
.opt span{flex:1;min-width:0;font-weight:500}
.opt small{font:500 13px var(--f-latin);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.opt svg{flex:none;visibility:hidden;color:var(--signal)}
.opt[aria-pressed="true"] span{font-weight:600}
.opt[aria-pressed="true"] svg{visibility:visible}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.field.col{flex-direction:column;align-items:stretch}
.field>span{font-weight:500}
.field>span small,.note{display:block;font-size:12px;color:var(--muted);font-weight:400;margin:0}
.ctl{display:flex;align-items:center;gap:6px}
.ctl button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--rule);background:transparent;font:500 14px var(--f-latin)}
.ctl output{font:400 22px var(--f-num);font-variant-numeric:tabular-nums;min-width:3.4ch;text-align:center}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;height:34px;min-width:40px;padding:0 10px;white-space:nowrap;font:500 14px var(--f-latin);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--rule);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.sw:checked{background:var(--signal)}
.sw:checked::after{transform:translateX(18px)}
input[type=range]{accent-color:var(--signal);width:100%}
.row2{display:flex;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* PDF 확인·수정 화면 */
.review{position:fixed;inset:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rv-in{max-width:520px;height:100%;margin:0 auto;overflow-y:auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px}
.rv-head{display:flex;align-items:center;gap:8px;min-height:44px}
.rv-head h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rv-nav output{font:400 24px var(--f-num);font-variant-numeric:tabular-nums;min-width:6.5ch;text-align:center}
.rv-flag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.rv-flag.info{background:var(--pad);color:var(--muted)}
.rv-card{background:var(--raise);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rv-cap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:600 11px var(--f-latin);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rv-cap select,.rv-cap input{height:30px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink);font:500 13px var(--f-latin);padding:0 6px;text-transform:none;letter-spacing:0}
.rv-cap input{width:64px}
.rv-src{background:#fff;border-radius:8px;min-height:60px;display:grid;place-items:center;overflow:hidden}
.rv-src canvas{display:block;width:100%;height:auto}
.rv-src p{color:#777;font-size:12px;margin:0;padding:16px}
#rvSvg{display:block;width:100%;height:auto}
.rv-grid{overflow-x:auto}
.rv-grid table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:calc(var(--cols)*15px + 44px)}
.rv-grid th{width:44px;font:500 11px var(--f-body);color:var(--muted);text-align:left;padding-right:4px;white-space:nowrap}
.rv-grid td{height:28px;border:1px solid var(--rule);text-align:center;font:700 12px var(--f-latin);cursor:pointer;padding:0;user-select:none;-webkit-user-select:none}
.rv-grid td.beat{border-left:2px solid var(--muted)}
.rv-grid td.on{background:var(--ink);color:var(--bg)}
.rv-grid td.acc{background:var(--signal);color:#fff}
.rv-grid td.soft{background:var(--pad-press);color:var(--ink)}
.rv-foot{position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="mark">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="9" r="3.2" fill="currentColor"/><circle cx="13" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      루디트레이너
    </div>
    <button class="icon" id="btnSettings" aria-label="연습 설정">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"><path d="M3 6h14M3 14h14"/><circle cx="7.5" cy="6" r="2.2" fill="var(--bg)"/><circle cx="12.5" cy="14" r="2.2" fill="var(--bg)"/></g></svg>
    </button>
  </header>
  <nav class="modes" role="tablist" aria-label="연습 모드">
    <button role="tab" data-mode="rudiment" aria-selected="true">루디먼트</button>
    <button role="tab" data-mode="read" aria-selected="false">초견</button>
    <button role="tab" data-mode="song" aria-selected="false">노래</button>
    <button role="tab" data-mode="kit" aria-selected="false">악보</button>
  </nav>

  <section class="score" id="score" aria-label="악보">
    <div class="title-row">
      <button class="pick" id="pickPattern" aria-label="패턴 고르기"><span id="patName"></span>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="icon" id="btnNew" aria-label="새 패턴 만들기" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon" id="btnShare" aria-label="이 패턴 공유하기" hidden style="margin-left:0">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><g stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12.5V3M6.5 6.5L10 3l3.5 3.5"/><path d="M5 9.5H4.5v7h11v-7H15"/></g></svg>
      </button>
    </div>
    <div class="meta" id="patMeta"></div>
    <button class="songbar" id="songBar" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 13.5V3.5l8-1.5v10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><circle cx="5" cy="13.5" r="2" fill="currentColor"/><circle cx="13" cy="12" r="2" fill="currentColor"/></svg>
      <span class="nm" id="songName">노래 고르기</span><span class="sm" id="songMeta"></span>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="staff-wrap" id="staffWrap"><svg id="staff" role="img" aria-label="드럼 악보"></svg></div>
    <div class="beats" id="beats" aria-hidden="true"><i class="acc"></i><i></i><i></i><i></i></div>
    <div class="overlay" id="overlay" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </section>

  <section class="transport">
    <button class="step" id="bpmDown" aria-label="느리게"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <div class="tempo"><output id="bpmOut">80</output><span id="bpmUnit">BPM</span></div>
    <button class="step" id="bpmUp" aria-label="빠르게"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="play" id="btnPlay" aria-label="시작"></button>
  </section>

  <section class="pads">
    <button class="pad" id="padL" aria-label="왼손 패드 (키보드 F)"><span class="hint"></span><b>L</b><small>왼손</small></button>
    <button class="pad" id="padR" aria-label="오른손 패드 (키보드 J)"><span class="hint"></span><b>R</b><small>오른손</small></button>
    <div class="result" id="result" hidden></div>
  </section>
</div>

<input type="file" id="fileSong" accept="audio/*" class="vh" tabindex="-1" aria-hidden="true">

const RUD_GROUPS=['롤','패러디들','플램'];
// 초견: 잘 알려진 교재들의 연습 원리를 본떠, 한 박짜리 리듬 조각(cell)을 골라 이어 붙여 매번 새로 만들어요
//  x 침, X 악센트, F 플램, - 쉼표, R/L 손이 정해진 칸 / stick: alt 번갈아, nat 박자 위치(정박 R·엇박 L), cell 조각에 적힌 손
//  repeat: 두 박짜리 스티킹을 마디 안에서 되풀이 (스틱 컨트롤식)
const LV=[
  {id:1, name:'레벨 1', desc:'4분음표와 쉼표',             sub:1,stick:'alt', cells:['x','x','x','-']},

  {id:8, name:'레벨 8', desc:'악센트 읽기',                sub:4,stick:'alt', cells:['Xxxx','xXxx','xxXx','xxxX','XxXx','xXxX','XxxX','xXXx']},
  {id:9, name:'레벨 9', desc:'셋잇단',                     sub:3,stick:'alt', cells:['xxx','xxx','x-x','xx-','-xx','x--']},
  {id:10,name:'레벨 10',desc:'셋잇단 스티킹',              sub:3,stick:'cell',repeat:true, cells:['RLR','LRL','RRL','LLR','RLL','LRR']},

const SUBNAME={1:'4분음표',2:'8분음표',3:'셋잇단',4:'16분음표'};
const BARS=2;
// 'lRrL' → [{h:'R',g:'L'},{h:'L',g:'R'}]. 소문자는 다음 음의 꾸밈음, '-'는 쉼표
function parseCyc(cyc){const out=[];let g=null;for(const c of cyc){if(c==='l'||c==='r'){g=c.toUpperCase();continue}out.push(c==='-'?null:{h:c,g});g=null}return out}
const stickPreview=r=>{
  const t=parseCyc(r.cyc).map(c=>c?(c.g?c.g.toLowerCase():'')+c.h:'·'),k=r.sub===2?4:r.sub,out=[];
  for(let i=0;i<t.length&&out.length<4;i+=k)out.push(t.slice(i,i+k).join(''));return out.join(' ');
};

function buildRud(id){
  const r=RUD.find(x=>x.id===id)||RUD[0],cyc=parseCyc(r.cyc),n=BARS*4*r.sub,slots=[];
  for(let j=0;j<n;j++){const k=j%cyc.length,c=cyc[k];slots.push(c?{h:c.h,g:c.g,acc:r.acc.includes(k)}:null)}
  return {name:r.name,sub:r.sub,bars:BARS,slots};
}
function genPattern(id){
  const L=LV.find(x=>x.id===id)||LV[0],sub=L.sub,beats=BARS*4,pick=a=>a[Math.floor(Math.random()*a.length)];
  let slots=[];
  for(let t=0;t<30;t++){
    const seq=[];
    if(L.repeat)for(let b=0;b<BARS;b++){const A=pick(L.cells),B=pick(L.cells);seq.push(A,B,A,B)}
    else{for(let b=0;b<beats;b++)seq.push(pick(L.cells));if(seq[0][0]==='-'&&Math.random()<.7)seq[0]=L.cells[0]} // 첫 박은 대개 치고 시작
    slots=[];
    seq.forEach(c=>{for(const ch of c)slots.push(ch==='-'?null:{h:/[RL]/.test(ch)?ch:'R',acc:ch==='X',f:ch==='F'})});
    if(slots.filter(Boolean).length>=beats)break; // 너무 비면 다시
  }
  if(L.stick==='alt'||(L.stick==='nat'&&sub===1)){let h='R';slots.forEach(s=>{if(s){s.h=h;h=h==='R'?'L':'R'}})}
  else if(L.stick==='nat'){slots.forEach((s,j)=>{if(s)s.h=(j%sub)%2===0?'R':'L'})}
  slots.forEach(s=>{if(s){if(s.f)s.g=s.h==='R'?'L':'R';delete s.f}});
  return {name:`초견 ${L.name}`,sub,bars:BARS,slots,gen:true,lvl:L.id};
}

/* ---------- 드럼 세트 악보 (곡 파일) ---------- */
// st: 오선 맨 윗줄에서 아래로 반 칸씩 센 위치. cym=심벌(오른손), foot=발(판정 안 함)
const KIT={
  cr:{st:-3,head:'x',cym:1}, hh:{st:-1,head:'x',cym:1}, rd:{st:0,head:'x',cym:1},
  t1:{st:1,head:'n'}, t2:{st:2,head:'n'}, sd:{st:3,head:'n'}, ft:{st:5,head:'n'}, bd:{st:7,head:'n',foot:1}
};
const KIT_DRUMS=['sd','t1','t2','ft'],KIT_CYMS=['cr','hh','rd'];
const DEMO_KIT={title:'예제 · 기본 8비트',bpm:90,grid:16,bars:[
  {label:'그루브',hh:'x-x-x-x-x-x-x-x-',sd:'----o-------o---',bd:'o-------o-o-----'},
  {repeat:2},
  {hh:'x-x-x-x-x-x-x-o-',sd:'----o-------o---',bd:'o-------o-o-----'},
  {label:'고스트 노트',hh:'x-x-x-x-x-x-x-x-',sd:'----O--g----O-g-',bd:'o-------o-o-----'},
  {repeat:1},
  {label:'필인',sd:'oooooooo--------',t1:'--------oo------',t2:'----------oo----',ft:'------------oooo',bd:'o---------------'},
  {label:'다시 그루브',cr:'x---------------',hh:'--x-x-x-x-x-x-x-',sd:'----o-------o---',bd:'o-------o-o-----'},
]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 곡 파일(JSON)을 마디 목록으로. 칸 문자: '-' 또는 '.' 쉼표, 소문자 침, 대문자 악센트, g 고스트, 하이햇의 o 오픈
function parseSong(j){
  if(!j||!Array.isArray(j.bars)||!j.bars.length)throw new Error('bars(마디 목록)가 없어요');
  const bars=[];let bpm=clamp(+j.bpm||80,30,300);
  j.bars.forEach((b,n)=>{
    // {repeat:n} 바로 앞 마디를 n번, {repeat:n, bars:m} 앞의 m마디 묶음을 n번
    if(b.repeat){
      const span=b.bars||1;if(bars.length<span)throw new Error(`${n+1}번째 항목: 반복할 앞 마디가 없어요`);
      const grp=bars.slice(-span);for(let k=0;k<b.repeat;k++)grp.forEach(x=>bars.push({...x,label:null}));return;
    }
    if(b.bpm)bpm=clamp(+b.bpm,30,300);
    const grid=b.grid||j.grid||16;
    if(![4,8,12,16,24,48].includes(grid))throw new Error(`${bars.length+1}마디: grid는 4, 8, 12, 16, 24, 48 중 하나여야 해요`);
    const clean=s=>String(s).replace(/[\s|]/g,'');
    const bar={grid,bpm,label:b.label||null,hits:[]};
    for(let k=0;k<grid;k++){
      const h={};
      for(const inst of Object.keys(KIT)){if(b[inst]==null)continue;const c=clean(b[inst])[k];if(c&&c!=='-'&&c!=='.')h[inst]=c}
      if(b.stick){const c=clean(b.stick)[k];if(c&&'RLB'.includes(c))h.stick=c}
      bar.hits.push(h);
    }
    bars.push(bar);
  });
  return {title:j.title||'제목 없는 악보',bpm:bars[0].bpm,bars,tempoChanges:bars.some(b=>b.bpm!==bars[0].bpm)};
}
// 손 정하기: 심벌=R, 혼자 나온 스네어·탐=L, 심벌과 북이 같이 나오면 두 손,
// 북만 연달아 나오면(필인) 박자 위치로 R/L(16·8분: 정박 R 엇박 L, 셋잇단: 번갈아). stick 줄이 있으면 그게 우선.
function assignHands(bar){
  const g=bar.grid,hits=bar.hits,fine=g<=16&&g%3!==0; // 4·8·16 격자는 박자 위치(정박 R, 엇박 L), 그 외는 번갈아
  const near=fine?1:g/8; // 이 간격(8분음표) 안에 붙어 있으면 '연달아'
  const isHand=k=>Object.keys(hits[k]).some(i=>KIT[i]&&!KIT[i].foot);
  const cym=k=>KIT_CYMS.some(i=>hits[k][i]);
  const drm=k=>KIT_DRUMS.filter(i=>hits[k][i]).length;
  const solo=k=>!cym(k)&&drm(k)===1;
  const prevHit=k=>{for(let j=k-1;j>=0&&k-j<=near;j--)if(isHand(j))return j;return -1};
  const nextHit=k=>{for(let j=k+1;j<g&&j-k<=near;j++)if(isHand(j))return j;return -1};
  const out=[];
  for(let k=0;k<g;k++){
    const h=hits[k],c=cym(k),d=drm(k);let hands=[];
    if(h.stick)hands=h.stick==='B'?['R','L']:[h.stick];
    else if(c&&d)hands=['R','L'];
    else if(c)hands=['R'];
    else if(d>=2)hands=['R','L'];
    else if(d===1){
      const p=prevHit(k),n=nextHit(k),pr=p>=0&&solo(p),nr=n>=0&&solo(n);
      if(!pr&&!nr)hands=['L'];
      else if(fine)hands=[k%2===0?'R':'L'];
      else hands=[pr&&out[p].length===1?(out[p][0]==='R'?'L':'R'):'R'];
    }
    out.push(hands);
  }
  return out;
}
function buildKit(song){
  const notes=[];let maxSub=1;
  song.bars.forEach((bar,b)=>{
    const sub=bar.grid/4;maxSub=Math.max(maxSub,sub);bar.hands=assignHands(bar);
    bar.hands.forEach((hd,slot)=>{
      if(!hd.length)return;const hit=bar.hits[slot],sib=[];
      const acc=Object.keys(hit).some(i=>KIT[i]&&!KIT[i].foot&&/[A-Z]/.test(hit[i]));
      // 드럼 세트 악보는 손을 정하지 않아요: 같은 순간에 치는 악기들은 패드 아무거나 한 번 (h:'A')
      const i=notes.length;sib.push(i);notes.push({i,pos:b*4+slot/sub,h:'A',g:null,acc,bar:b,beat:Math.floor(slot/sub),k:`${b}-${slot}`,sib});
    });
  });
  return {kind:'kit',name:song.title,sub:maxSub,bars:song.bars.length,song,notes,slots:[]};
}
let kitJson=store.get('kitCur',DEMO_KIT);
S.kitBpm=store.get('kitBpm',(kitJson&&kitJson.bpm)||90);S.kitStart=0;

const cur={pattern:null,notes:[],slotNote:[]};

}
function setPattern(P){
  hideResult();
  if(P.kind==='kit'){
    cur.pattern=P;cur.notes=P.notes;cur.slotNote=[];
    $('#patName').textContent=P.name;kitMeta();renderStaff();updateTempo();return;
  }
  cur.pattern=P;cur.notes=[];cur.slotNote=new Array(P.slots.length).fill(-1);
  P.slots.forEach((s,j)=>{if(s){cur.slotNote[j]=cur.notes.length;
    cur.notes.push({i:cur.notes.length,j,pos:j/P.sub,h:s.h,g:s.g||null,acc:s.acc,bar:Math.floor(j/(4*P.sub)),beat:Math.floor(j/P.sub)%4})}});
  $('#patName').textContent=P.name;
  $('#patMeta').innerHTML=`<b>${SUBNAME[P.sub]}</b> &nbsp;·&nbsp; 4/4 &nbsp;·&nbsp; ${P.bars}마디 반복${P.gen?' &nbsp;·&nbsp; 자동 생성':''}`;
  renderStaff();
}

/* ---------- 악보 그리기 ---------- */
let geo=[],noteEls=[],curEls=[];
function restGlyph(t,x,y){

/* 소리 경로 진단: A 웹 오디오(440Hz) → B MediaStream→audio(660Hz) → C 일반 오디오 파일(880Hz)
   각각 0.4초 삐 소리 3번. 녹화 영상의 주파수만 보면 어느 경로가 녹화에 담겼는지 가려낼 수 있어요. */
function makeWav(sr,dur,beeps){
  const n=Math.ceil(sr*dur),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const t=i/sr;let s=0;
    for(const b of beeps){const u=t-b.t;if(u>=0&&u<b.len)s+=.5*Math.min(1,u/.01,(b.len-u)/.01)*Math.sin(2*Math.PI*b.f*u)}
    v.setInt16(44+i*2,Math.max(-1,Math.min(1,s))*32767,true);
  }
  return new Blob([buf],{type:'audio/wav'});
}

    .forEach(([t,at])=>setTimeout(()=>show(t+'\n지금 들리나요?'),(1+at)*1000-150));

let recDest=null,recEl=null;
function routeOutput(){

const pans={},tapBuf={};
function makePan(v){if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=v;p.connect(master);return p}return master}
// 소리 그래프를 ac(실시간 또는 오프라인) 위에 만들기
function synthHit(ac,noise,out,t,hand,vol,soft){
  const g=ac.createGain();g.connect(out);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+(soft?.08:.14));
  const ns=ac.createBufferSource();ns.buffer=noise;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=soft?3200:(hand==='L'?2100:2400);bp.Q.value=.9;
  ns.connect(bp);bp.connect(g);ns.start(t);ns.stop(t+.16);
  if(!soft){
    const o=ac.createOscillator(),og=ac.createGain();o.type='triangle';
    o.frequency.setValueAtTime(hand==='L'?240:262,t);o.frequency.exponentialRampToValueAtTime(140,t+.06);
    og.gain.setValueAtTime(vol*.8,t);og.gain.exponentialRampToValueAtTime(.001,t+.08);
    o.connect(og);og.connect(out);o.start(t);o.stop(t+.09);
  }
}
// 패드 소리는 미리 녹음해 두고 누를 때 버퍼 하나만 재생해요 (누르는 순간 처리량을 최소로)
async function prerenderTaps(){
  for(const h of ['L','R','tick']){
    try{
      const sr=ctx.sampleRate,oc=new OfflineAudioContext(1,Math.ceil(sr*.17),sr);
      const nb=oc.createBuffer(1,noiseBuf.length,sr);nb.getChannelData(0).set(noiseBuf.getChannelData(0));
      if(h==='tick'){ // 아주 짧고 가벼운 틱
        const s=oc.createBufferSource();s.buffer=nb;const f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=4500;
        const g=oc.createGain();g.gain.setValueAtTime(.5,0);g.gain.exponentialRampToValueAtTime(.001,.025);
        s.connect(f);f.connect(g);g.connect(oc.destination);s.start(0);s.stop(.03);
      }else synthHit(oc,nb,oc.destination,0,h,.6,false);
      tapBuf[h]=await oc.startRendering();
    }catch(e){}
  }
}
function playTap(hand){
  if(S.padSound==='off')return;
  const b=tapBuf[S.padSound==='tick'?'tick':hand];
  if(!b){if(S.padSound==='snare')playHit(ctx.currentTime,hand,.6,false);return}
  const s=ctx.createBufferSource();s.buffer=b;s.connect(pans[hand]);s.start(0);
}
function playHit(t,hand,vol,soft){synthHit(ctx,noiseBuf,pans[hand],t,hand,vol,soft)}
function playClick(t,acc){
  const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=acc?1760:1180;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(acc?.42:.3,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.05);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+.06);

/* ---------- 노래 박자 분석 ---------- */
function analyze(buf){
  const sr=buf.sampleRate,hop=Math.round(sr*.005),hopS=hop/sr;
  const c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):null;
  const n=Math.floor(Math.min(buf.length,sr*120)/hop);
  const E=new Float32Array(n),EL=new Float32Array(n),on=new Float32Array(n),lo=new Float32Array(n);
  const a=1-Math.exp(-2*Math.PI*150/sr);let y=0,mE=0,mL=0;
  for(let f=0;f<n;f++){
    let s=0,sl=0;const st=f*hop;
    for(let k=0;k<hop;k++){let x=c0[st+k];if(c1)x=(x+c1[st+k])*.5;s+=x*x;y+=a*(x-y);sl+=y*y}
    E[f]=s;EL[f]=sl;mE+=s;mL+=sl;
  }
  mE=mE/n*.05+1e-12;mL=mL/n*.05+1e-12;
  // 곡 전체 음량 대비로 압축한 에너지가 갑자기 커지는 지점 = 타격 지점
  for(let f=1;f<n;f++){
    on[f]=Math.max(0,Math.log1p(E[f]/mE)-Math.log1p(E[f-1]/mE));
    lo[f]=Math.max(0,Math.log1p(EL[f]/mL)-Math.log1p(EL[f-1]/mL));
  }
  // 1) 자기상관으로 대략적인 템포
  const minLag=Math.floor(60/200/hopS),maxLag=Math.ceil(60/60/hopS);
  let bestLag=minLag,bestV=-1;
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0;for(let f=lag;f<n;f++)s+=on[f]*on[f-lag];
    const bpm=60/(lag*hopS),w=Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.8,2));
    if(s*w>bestV){bestV=s*w;bestLag=lag}
  }
  // 2) 2배·절반·3:2 후보까지 박 격자를 미세하게 맞춰보고, 박 위치의 평균 세기가 가장 큰 템포를 고르기
  const coarse=60/(bestLag*hopS),cands=[];
  [1,2,.5,1.5,2/3,4/3,.75].forEach(m=>{const b=coarse*m;if(b>=70&&b<=180&&!cands.some(c=>Math.abs(c/b-1)<.03))cands.push(b)});
  let best=null;
  for(const c of cands){
    let cb={s:-1};
    for(let b=c*.97;b<=c*1.03;b+=.05){
      const P=60/b/hopS;
      for(let ph=0;ph<P;ph+=1){
        let s=0,cnt=0;for(let x=ph;x<n-1;x+=P){const i=Math.round(x);s+=on[i]+.5*((on[i-1]||0)+on[i+1]);cnt++}
        s/=cnt||1;if(s>cb.s)cb={s,b,ph,P};
      }
    }
    cb.score=cb.s*Math.exp(-.5*Math.pow(Math.log2(cb.b/115)/.9,2));
    if(!best||cb.score>best.score)best=cb;
  }
  if(!best)best={b:120,ph:0,P:60/120/hopS};
  // 3) 저음(킥)이 가장 강한 박을 1박으로
  let bj=0,bs=-1;
  for(let j=0;j<4;j++){let s=0;for(let x=best.ph+j*best.P;x<n;x+=4*best.P)s+=lo[Math.round(x)]||0;if(s>bs){bs=s;bj=j}}
  return {bpm:Math.round(best.b*10)/10,off:(best.ph+bj*best.P)*hopS};
}
async function makeDemo(){
  const sr=44100,bpm=96,spb=60/bpm,intro=.42,bars=24,dur=intro+bars*4*spb+1;
  const oc=new OfflineAudioContext(2,Math.ceil(sr*dur),sr);
  const nb=oc.createBuffer(1,sr,sr),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const env=(t,v,len)=>{const g=oc.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+len);g.connect(oc.destination);return g};
  const kick=t=>{const o=oc.createOscillator();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);o.connect(env(t,.95,.32));o.start(t);o.stop(t+.33)};
  const noise=(t,v,len,type,f)=>{const s=oc.createBufferSource();s.buffer=nb;const fl=oc.createBiquadFilter();fl.type=type;fl.frequency.value=f;s.connect(fl);fl.connect(env(t,v,len));s.start(t);s.stop(t+len+.01)};
  const snare=t=>{noise(t,.5,.18,'highpass',1300);const o=oc.createOscillator();o.frequency.value=190;o.connect(env(t,.3,.08));o.start(t);o.stop(t+.09)};
  const bass=(t,f,len)=>{const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;o.connect(lp);lp.connect(env(t,.22,len));o.start(t);o.stop(t+len+.01)};
  const roots=[55,55,43.65,49];
  for(let b=0;b<bars;b++)for(let q=0;q<4;q++){
    const t=intro+(b*4+q)*spb;
    if(q===0||q===2)kick(t);if(q===2)kick(t+spb*.5);
    if(q===1||q===3)snare(t);
    noise(t,.16,.04,'highpass',7000);noise(t+spb/2,.08,.035,'highpass',7000);
    bass(t,roots[b%4],spb*.85);
  }
  return oc.startRendering();
}

/* ---------- 연습 실행 ---------- */
let run=null,calib=null,wake=null;
async function requestWake(){try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wake)wake.release()}catch(e){}wake=null}
function setPlayBtn(on){const b=$('#btnPlay');b.innerHTML=on?ICON.stop:ICON.play;b.classList.toggle('on',on);b.setAttribute('aria-label',on?'정지':'시작')}

function startRun(){
  ensureAudio();hideResult();
  const P=cur.pattern,notes=cur.notes,N=notes.length;if(!N)return;
  const startCtx=ctx.currentTime+.15;let spb,t0,reps,src=null,firstBeat,off=0,tAt=null,posAt=null;
  if(P.kind==='kit'){
    // 마디마다 템포가 다를 수 있어요: 마디 시작 시각표를 만들어 박 위치 ↔ 시각을 바꿔요
    const fac=S.kitBpm/P.song.bpm,bars=P.song.bars,sb=S.kitStart,bspb=bars.map(b=>60/(b.bpm*fac));
    off=sb*4;reps=1;firstBeat=-4;spb=bspb[sb];t0=startCtx+4*spb;
    kitRow=-1;if(geo[sb])showKitRow(geo[sb].row,true); // 카운트 동안 시작 줄을 맨 위로
    const bt=[];let tt=t0;for(let b=sb;b<bars.length;b++){bt[b]=tt;tt+=4*bspb[b]}
    tAt=pos=>{const b=clamp(Math.floor(pos/4+1e-9),sb,bars.length-1);return bt[b]+(pos-b*4)*bspb[b]};
    posAt=x=>{let lo=sb,hi=bars.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(bt[m]<=x)lo=m;else hi=m-1}return lo*4+(x-bt[lo])/bspb[lo]};
  }else if(S.mode==='song'){
    if(!song.buf){openSongSheet();return}
    const r=song.rate,bar=240/song.bpm;
    let d=song.off+Math.max(0,Math.ceil((song.startAt-song.off)/bar-1e-6))*bar;
    if(d<bar*.75)d+=bar;
    const sPlay=Math.max(0,d-bar);
    spb=60/song.bpm/r;t0=startCtx+(d-sPlay)/r;
    reps=Math.floor((song.buf.duration-d)/(bar*P.bars));
    if(reps<1){toast('시작 위치 뒤로 남은 노래가 너무 짧아요');return}
    src=ctx.createBufferSource();src.buffer=song.buf;src.playbackRate.value=r;src.connect(songGain);src.start(startCtx,sPlay);
    firstBeat=Math.ceil((startCtx-t0)/spb);
  }else{
    spb=60/S.bpm;t0=startCtx+4*spb;reps=S.reps===0?200:S.reps;firstBeat=-4;
  }
  // off: 시작 마디(박 단위). 그 앞의 음표는 빼고, 남은 부분을 한 바퀴로 봐요
  if(!tAt)tAt=pos=>t0+(pos-off)*spb;
  const beats=P.bars*4-off,L=tAt(P.bars*4)-t0,events=[],use=notes.filter(n=>n.pos>=off),kOf={};
  use.forEach((n,k)=>{kOf[n.i]=k});
  for(let rep=0;rep<reps;rep++)for(const n of use)events.push({t:t0+rep*L+(tAt(n.pos)-t0),h:n.h,g:n.g,i:n.i,rep,st:null,why:null,err:null,tapH:null,gt:null});
  // 판정 창은 음표마다 이웃 음표와의 간격에 맞춰요 (빽빽한 곳은 좁게, 여유 있는 곳은 넓게)
  const times=[...new Set(events.map(e=>e.t))];let ti=0,win=0;
  events.forEach(e=>{
    while(times[ti]<e.t-1e-9)ti++;
    const gap=Math.min(ti>0?e.t-times[ti-1]:Infinity,ti<times.length-1?times[ti+1]-e.t:Infinity);
    const g=isFinite(gap)?gap:.5;
    e.w=Math.min(.16,Math.max(.035,g*.75));e.gd=Math.min(e.w,.09,Math.max(.05,g*.45));win=Math.max(win,e.w);
  });

  for(let k=firstBeat;k<total;k++){
    const t=k<0?t0+k*spb:t0+Math.floor(k/beats)*L+(tAt(off+k%beats)-t0);
    clicks.push({t,acc:((k%4)+4)%4===0,count:k<0&&k>=-4});
  }
  run={t0,spb,L,reps,N:use.length,kOf,off,beats,posAt,bars:P.bars,events,clicks,ci:0,gi:0,scan:0,shown:-1,lastC:'',extra:0,src,
    win,tEnd:t0+reps*L};
  clearPaint();
  run.timer=setInterval(schedule,25);schedule();
  run.raf=requestAnimationFrame(frame);
  if(src)src.onended=()=>{if(run&&run.src===src)finish(true)};
  setPlayBtn(true);requestWake();
}
function schedule(){
  const R=run;if(!R)return;const now=ctx.currentTime,ahead=now+.12;
  while(R.ci<R.clicks.length&&R.clicks[R.ci].t<ahead){const c=R.clicks[R.ci++];if(c.t>=now-.01&&(S.metro||c.count))playClick(c.t,c.acc)}
  while(R.gi<R.events.length&&R.events[R.gi].t<ahead){const e=R.events[R.gi++];if(S.guide&&e.t>=now-.01){if(e.g)playHit(e.t-.03,e.g,.1,true);playHit(e.t,e.h==='A'?'R':e.h,cur.notes[e.i].acc?.4:.2,true)}}
}
function frame(){
  const R=run;if(!R)return;R.raf=requestAnimationFrame(frame);
  const now=ctx.currentTime-S.lat,ev=R.events,N=R.N;
  while(R.scan<ev.length&&ev[R.scan].t+ev[R.scan].w<now){const e=ev[R.scan];if(!e.st){e.st='bad';e.why='miss';if(e.rep===R.shown)paint(e)}R.scan++}
  const rel=(now-R.t0)/R.L,rep=Math.floor(rel);
  if(rep>=0&&rep<R.reps&&rep!==R.shown){R.shown=rep;clearPaint();for(let i=0;i<N;i++)paint(ev[rep*N+i])}
  if(rel>=0&&rel<R.reps){const pb=R.posAt?R.posAt(now):R.off+(rel-rep)*R.beats,b=Math.min(R.bars-1,Math.floor(pb/4));moveCursor(b,geo[b].xOf(pb))}else hideCursors();
  const bk=now<R.t0||!R.posAt?Math.floor((now-R.t0)/R.spb):Math.floor(R.posAt(now)-R.off+1e-9);
  lightBeat(bk>=-4&&now<R.tEnd?((bk%4)+4)%4:-1);
  let c='';if(now<R.t0&&bk>=-4)c=String(bk+5);
  if(c!==R.lastC){R.lastC=c;overlay(c)}
  if(S.hint){
    let nx=null,nk=-1;for(let k=R.scan;k<ev.length;k++){if(!ev[k].st){nx=ev[k];nk=k;break}}
    let hd=null;
    if(nx&&nx.t-now<R.spb*1.5){
      hd=nx.g&&nx.gt==null?nx.g:nx.h==='A'?'B':nx.h; // 손 구분 없는 음표는 두 패드 다 켜요
      const n2=ev[nk+1];if(n2&&!n2.st&&Math.abs(n2.t-nx.t)<.001&&n2.h!==nx.h)hd='B'; // 두 손 동시
    }
    setNext(hd);
  }
  if(now>R.tEnd+R.win+.05)finish(true);
}
// 플램 간격 기준(초): 이보다 붙으면 동시에 친 것(플랫 플램), 이보다 벌어지면 두 번 친 것
const FLAM_FLAT=.008,FLAM_WIDE=.12,FLAM_PRE=.16;
function hit(hand,ts){
  ensureAudio();
  const d=ts!=null?(performance.now()-ts)/1000:0,at=ctx.currentTime-(d>=0&&d<.1?d:0);
  playTap(hand);padFx(hand,'hit');
  if(S.vibe)try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  if(calib){calib.taps.push(at);return}
  const R=run;if(!R)return;
  judge(R,hand,at-S.lat);
}
// tap: 지연 보정을 뺀, 악보 기준 시각(초)
function judge(R,hand,tap){
  // 판정 창 안의 음표 중 같은 손 음표를 먼저 찾아요. 빠른 템포에서 살짝 어긋나도 옆 음표(반대 손)로 오판하지 않게.
  let best=null,bd=1e9,same=null,sd=1e9,gr=null,gd=1e9;
  for(let k=Math.max(0,R.scan-6);k<R.events.length;k++){
    const e=R.events[k];if(e.t-Math.max(R.win,FLAM_PRE)>tap)break;
    // 플램 꾸밈음 후보: 본음보다 조금 먼저(최대 FLAM_PRE) 친 반대 손
    if(e.g===hand&&e.gt==null){const d=e.t-tap;if(d>=-.05&&d<=FLAM_PRE&&Math.abs(d)<gd){gd=Math.abs(d);gr=e}}
    if(e.st)continue;
    const dd=Math.abs(tap-e.t);if(dd>e.w)continue;
    if(dd<bd){bd=dd;best=e}
    if((e.h===hand||e.h==='A')&&dd<sd){sd=dd;same=e}
  }
  if(gr&&(!same||sd>same.gd)){
    gr.gt=tap;
    if(gr.st){ // 본음을 먼저 쳤어요: 거의 동시면 플랫 플램, 아니면 순서가 반대
      if(gr.st==='ok'||gr.why==='flamgrace'){gr.st='bad';gr.why=gr.mt!=null&&tap-gr.mt<FLAM_FLAT?'flamflat':'flamorder';if(gr.rep===R.shown)paint(gr)}
      padFx(hand,'badf');
    }else padFx(hand,'okf');
    return;
  }
  if(same)best=same;
  if(!best){R.extra++;padFx(hand,'badf');return}
  best.err=tap-best.t;best.tapH=hand;best.mt=tap;
  if(best.h!==hand&&best.h!=='A'){best.st='bad';best.why='hand'}
  else if(Math.abs(best.err)>best.gd){best.st='bad';best.why=best.err<0?'early':'late'}
  else if(best.g){
    const gap=best.gt==null?null:tap-best.gt;
    if(gap==null){best.st='bad';best.why='flamgrace'}
    else if(gap<FLAM_FLAT){best.st='bad';best.why='flamflat'}
    else if(gap>FLAM_WIDE){best.st='bad';best.why='flamwide'}
    else best.st='ok';
  }
  else best.st='ok';
  if(best.rep===R.shown)paint(best);
  padFx(hand,best.st==='ok'?'okf':'badf');
}
function finish(show){
  const R=run;if(!R)return;run=null;
  clearInterval(R.timer);cancelAnimationFrame(R.raf);
  if(R.src){R.src.onended=null;try{R.src.stop()}catch(e){}}
  releaseWake();hideCursors();setNext(null);overlay('');lightBeat(-1);setPlayBtn(false);
  clearPaint();
  if(!show)return;
  const ev=R.events.filter(e=>e.st);if(ev.length<4)return;
  showResult(R,ev);
}

/* ---------- 결과와 진단 ---------- */
function showResult(R,ev){
  const notes=cur.notes,N=notes.length;
  const ok=ev.filter(e=>e.st==='ok').length,pct=Math.round(100*ok/ev.length);
  const cnt=w=>ev.filter(e=>e.why===w).length;
  const lines=[];
  ['L','R'].forEach(hd=>{
    const a=ev.filter(e=>e.err!=null&&e.tapH===e.h&&e.h===hd);if(a.length<3)return;
    const m=a.reduce((s,e)=>s+e.err,0)/a.length*1000,nm=hd==='L'?'왼손':'오른손';
    if(m>=12)lines.push(`${nm}이 평균 <b>${Math.round(m)}ms 늦어요</b>`);
    else if(m<=-12)lines.push(`${nm}이 평균 <b>${Math.round(-m)}ms 빨라요</b>`);
    else lines.push(`${nm} 타이밍은 안정적이에요 (평균 ${m>=0?'+':''}${Math.round(m)}ms)`);
  });
  const TR={RR:'오른손 더블(R R)에서',LL:'왼손 더블(L L)에서',RL:'R → L로 넘어갈 때',LR:'L → R로 넘어갈 때'};
  const tr={};
  ev.forEach(e=>{const k=notes[(e.i-1+N)%N].h+e.h;(tr[k]=tr[k]||{t:0,b:0}).t++;if(e.st==='bad')tr[k].b++});
  const worst=Object.entries(tr).filter(([,v])=>v.t>=3&&v.b>0).sort((a,b)=>b[1].b/b[1].t-a[1].b/a[1].t)[0];
  if(worst&&TR[worst[0]]&&worst[1].b/worst[1].t>=.25)lines.push(`${TR[worst[0]]} <b>자주 틀려요</b> (${worst[1].t}번 중 ${worst[1].b}번)`);
  const lc={};ev.forEach(e=>{if(e.st==='bad'){const n=notes[e.i],k=n.bar*4+n.beat;lc[k]=(lc[k]||0)+1}});
  const top=Object.entries(lc).sort((a,b)=>b[1]-a[1])[0];
  if(top&&top[1]>=2){const k=+top[0];lines.push(`${Math.floor(k/4)+1}마디 ${k%4+1}박이 가장 어려웠어요`)}
  // 양손이 똑같이 한쪽으로 밀리면 폰 지연 때문일 가능성이 커요 → 이 결과로 바로 보정
  const errs=ev.filter(e=>e.err!=null&&e.tapH===e.h).map(e=>e.err).sort((a,b)=>a-b);
  latFix=0;
  if(errs.length>=8){const med=errs[Math.floor(errs.length/2)];if(Math.abs(med)>=.02){latFix=med;
    lines.push(`전체 타이밍이 ${Math.round(Math.abs(med)*1000)}ms ${med>0?'늦게':'빠르게'} 잡혀요. 폰 지연 때문일 수 있어요`)}}
  const fl={grace:cnt('flamgrace'),flat:cnt('flamflat'),order:cnt('flamorder'),wide:cnt('flamwide')};
  if(fl.grace>=2)lines.push(`플램 꾸밈음이 자주 <b>빠져요</b> (${fl.grace}번). 본음 직전에 반대 손을 살짝`);
  if(fl.flat>=2)lines.push(`두 손을 <b>동시에</b> 쳐요 (${fl.flat}번). 꾸밈음을 아주 조금 먼저`);
  if(fl.order>=2)lines.push(`꾸밈음이 본음보다 <b>늦어요</b> (${fl.order}번)`);
  if(fl.wide>=2)lines.push(`꾸밈음과 본음 사이가 <b>너무 벌어져요</b> (${fl.wide}번). 한 번처럼 들리게`);
  if(S.speedup&&S.mode!=='song'&&pct>=90){
    const k=S.mode==='kit'?'kitBpm':'bpm';S[k]=clamp(S[k]+5,30,240);store.set(k,S[k]);updateTempo();lines.push(`다음 연습은 ${S[k]} BPM으로 올렸어요`);
  }
  const head=pct>=95?'완벽해요':pct>=80?'좋아요':pct>=60?'조금만 더':'템포를 낮춰 보세요';
  const el=$('#result');
  el.innerHTML=`<div class="res-top"><div class="res-score">${pct}<small>%</small></div><div><div class="res-head">${head}</div><div class="res-sub">${ev.length}음 중 ${ok}음 정확</div></div></div>`+
    `<ul class="res-list">${lines.map(l=>`<li>${l}</li>`).join('')}</ul>`+
    `<div class="res-sub">손 순서 ${cnt('hand')} · 빠름 ${cnt('early')} · 늦음 ${cnt('late')} · 놓침 ${cnt('miss')} · 헛침 ${R.extra}${notes.some(n=>n.g)?` · 플램 ${fl.grace+fl.flat+fl.order+fl.wide}`:''}</div>`+
    `<div class="res-actions">${latFix?`<button class="btn" data-act="fixlat">지연 보정 ${latFix>0?'+':'−'}${Math.round(Math.abs(latFix)*1000)}ms</button>`:''}<button class="btn" data-act="close">닫기</button>${cur.pattern.gen?'<button class="btn" data-act="new">새 패턴</button>':''}<button class="btn primary" data-act="again">다시 하기</button></div>`;
  el.hidden=false;
  // 악보를 처음부터 다시 훑으며 음표마다 결과 색을 칠해요
  const agg=notes.map(()=>({t:0,o:0}));ev.forEach(e=>{agg[e.i].t++;if(e.st==='ok')agg[e.i].o++});
  const step=Math.min(70,1600/N);
  notes.forEach((n,k)=>{const a=agg[k];if(!a.t)return;
    setTimeout(()=>{const nel=noteEls[k];if(nel&&!run)nel.classList.add(a.o/a.t>=.8?'ok':'bad');
      const b=n.bar;if(!run&&geo[b])moveCursor(b,geo[b].xOf(n.pos));if(k===N-1)setTimeout(()=>{if(!run)hideCursors()},300)},150+k*step)});
}
let latFix=0;
function hideResult(){$('#result').hidden=true}
$('#result').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='calib'){startCalib();return}
  if(a.dataset.act==='skipcal'){store.set('skipCal.'+S.posture,true);hideResult();startRun();return}
  if(a.dataset.act==='fixlat'){setLat(S.lat+latFix,true);latFix=0;a.remove();toast(`지연 보정을 ${Math.round(S.lat*1000)}ms로 바꿨어요`)}
  else if(a.dataset.act==='close'){hideResult();clearPaint()}
  else if(a.dataset.act==='new'){setPattern(patternForMode())}
  else{clearPaint();startRun()}
});

/* ---------- 지연 보정 ---------- */
// 4분 → 8분 → 셋잇단 → 16분, 각 8번씩. 단계 사이에는 준비 마디 하나.
// 단계마다 두 마디씩: 4분 8번, 8분 16번, 셋잇단 24번, 16분 32번
const CAL_STAGES=[{name:'4분음표',sub:1,n:8},{name:'8분음표',sub:2,n:16},{name:'셋잇단',sub:3,n:24},{name:'16분음표',sub:4,n:32}];
const CAL_BPM=72;
function startCalib(){
  ensureAudio();finish(false);closeSheet();hideResult();
  const spb=60/CAL_BPM,bar=4*spb,t0=ctx.currentTime+.4;
  let barIdx=1;
  const stages=CAL_STAGES.map(s=>{
    const start=t0+barIdx*bar,targets=[];
    for(let k=0;k<s.n;k++)targets.push(start+k*spb/s.sub);
    const nb=Math.ceil(s.n/s.sub/4);barIdx+=nb+1;
    return {...s,start,end:start+nb*bar,targets};
  });
  const endT=t0+(barIdx-1)*bar;
  for(let k=0;k<(barIdx-1)*4;k++)playClick(t0+k*spb,k%4===0);
  stages.forEach(s=>s.targets.forEach(t=>playHit(t,'R',.2,true)));
  calib={stages,taps:[],t0,spb,endT,raf:0};
  const loop=()=>{
    const C=calib;if(!C)return;C.raf=requestAnimationFrame(loop);
    const now=ctx.currentTime,s=C.stages.find(x=>now<x.end);
    lightBeat(now>=C.t0&&now<C.endT?Math.floor((now-C.t0)/C.spb)%4:-1);
    if(!s){overlay('');return}
    const i=C.stages.indexOf(s);
    if(now<s.start){
      const left=Math.ceil((s.start-now)/C.spb);
      overlay(`${POSTURES[S.posture]} 자세로 측정\n${i+1}/4 단계 · ${s.name}\n가이드 소리에 맞춰 아무 패드나 ${s.n}번\n\n${left}`,true);
    }else{
      const n=C.taps.filter(t=>t>=s.start-.2&&t<s.end).length;
      overlay(`${i+1}/4 단계 · ${s.name}\n${Math.min(n,s.n)} / ${s.n}`,true);
    }
  };
  loop();
  setTimeout(finishCalib,(endT-ctx.currentTime+.5)*1000);
}
function finishCalib(){
  const C=calib;if(!C)return;calib=null;cancelAnimationFrame(C.raf);overlay('');lightBeat(-1);
  const med=a=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[Math.floor(s.length/2)]:null};
  // 4분음표 단계(넓은 창)로 대략적인 지연을 먼저 구하고, 빠른 리듬은 그만큼 옮긴 위치에서 짝을 지어요
  let base=0;const per=[];
  C.stages.forEach((s,i)=>{
    const w=i===0?.4:C.spb/s.sub*.5,ds=[];
    C.taps.forEach(tp=>{let b=null;s.targets.forEach(t=>{const d=tp-t-base;if(Math.abs(d)<w&&(b==null||Math.abs(d)<Math.abs(b)))b=d});if(b!=null)ds.push(b+base)});
    if(i===0&&ds.length)base=med(ds);
    per.push({name:s.name,n:s.n,ds});
  });
  const all=per.flatMap(p=>p.ds);
  const el=$('#result');
  if(all.length<30){
    el.innerHTML=`<div class="res-head">탭이 부족해요</div><p class="note">가이드 소리에 맞춰 4분 8번, 8분 16번, 셋잇단 24번, 16분 32번 쳐 주세요. (${all.length}번 인식)</p>`+
      `<div class="res-actions"><button class="btn" data-act="close">닫기</button><button class="btn primary" data-act="calib">다시 측정</button></div>`;
    el.hidden=false;return;
  }
  setLat(med(all),true);
  const sd=Math.sqrt(all.reduce((s,d)=>s+(d-S.lat)**2,0)/all.length)*1000;
  el.innerHTML=`<div class="res-top"><div class="res-score">${Math.round(S.lat*1000)}<small>ms</small></div><div><div class="res-head">지연 보정 완료</div><div class="res-sub">${POSTURES[S.posture]} 자세로 저장 · ${all.length}번 탭 · 흔들림 ±${Math.round(sd)}ms</div></div></div>`+
    `<ul class="res-list">${per.map(p=>`<li>${p.name} ${p.ds.length?`${Math.round(med(p.ds)*1000)}ms`:'인식 안 됨'} <span class="res-sub">(${p.n}번 중 ${Math.min(p.n,p.ds.length)}번)</span></li>`).join('')}</ul>`+
    `<div class="res-actions"><button class="btn" data-act="calib">다시 측정</button><button class="btn primary" data-act="close">완료</button></div>`;
  el.hidden=false;
}

const head=t=>`<div class="sheet-head"><h2>${t}</h2><button class="txt" data-close>닫기</button></div>`;

function openPicker(){
  let groups,current;

function openSettings(){
  const sw=(id,on,t,s)=>`<label class="field"><span>${t}<small>${s}</small></span><input type="checkbox" class="sw" id="${id}"${on?' checked':''}></label>`;
  const html=head('연습 설정')+
    `<div class="field"><span>반복<small>노래 모드에서는 곡 끝까지</small></span><div class="seg" id="segReps">${[1,2,4,8,0].map(v=>`<button data-v="${v}" aria-pressed="${S.reps===v}">${v||'∞'}</button>`).join('')}</div></div>`+
    `<div class="field"><span>패드 소리<small>칠 때 나는 소리. 끄면 박자 클릭만 들려요</small></span><div class="seg" id="segPad">${[['off','끔'],['tick','틱'],['snare','스네어']].map(([v,l])=>`<button data-v="${v}" aria-pressed="${S.padSound===v}">${l}</button>`).join('')}</div></div>`+

    `<div class="field col"><span>소리 경로 진단<small>화면 녹화를 켠 채로 누르세요. 세 가지 경로로 높이가 다른 삐 소리를 내서, 녹화에 어떤 소리가 담기는지 확인해요 (약 10초)</small></span><button class="btn" id="btnSoundDiag">진단 시작</button></div>`+
    sw('optMetro',S.metro,'메트로놈 클릭','시작 전 카운트 4번은 항상 들려요')+
    sw('optGuide',S.guide,'가이드 소리','쳐야 할 음을 앱이 작게 같이 쳐줘요')+

const padL=$('#padL'),padR=$('#padR');
function padFx(hand,cls){
  const p=hand==='L'?padL:padR;

  p.classList.add(cls);

}
function setNext(h){padL.classList.toggle('next',h==='L'||h==='B');padR.classList.toggle('next',h==='R'||h==='B')}
function overlay(t,msg){const o=$('#overlay');o.textContent=t;o.className='overlay'+(msg?' msg':'');o.hidden=!t}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true},2800)}
function updateTempo(){
  if(S.mode==='song'){
    $('#bpmOut').textContent=song.buf?Math.round(song.bpm*song.rate):'—';
    $('#bpmUnit').textContent=`BPM · ${Math.round(song.rate*100)}%`;
  }else if(S.mode==='kit'&&cur.pattern&&cur.pattern.kind==='kit'){
    // 악보 템포는 첫 마디 기준. 중간에 템포가 바뀌는 곡은 같은 비율로 함께 빨라지거나 느려져요
    $('#bpmOut').textContent=S.kitBpm;$('#bpmUnit').textContent=`BPM · ${Math.round(S.kitBpm/cur.pattern.song.bpm*100)}%`;
  }else{$('#bpmOut').textContent=S.mode==='kit'?S.kitBpm:S.bpm;$('#bpmUnit').textContent='BPM'}
}
const bump=d=>{
  if(S.mode==='kit'){
    S.kitBpm=clamp(S.kitBpm+d,30,240);store.set('kitBpm',S.kitBpm);
    if(run&&!bump.told){bump.told=true;toast('바뀐 템포는 다음 시작부터 적용돼요')}
  }else if(S.mode==='song'){
    if(!song.buf)return;finish(false);
    // 노래는 재생 속도로 템포를 바꿔요 (원곡의 50~100%)
    const target=Math.round(song.bpm*song.rate)+d;song.rate=clamp(target/song.bpm,.5,1);
  }else{
    S.bpm=clamp(S.bpm+d,30,220);store.set('bpm',S.bpm);
    if(run&&!bump.told){bump.told=true;toast('바뀐 템포는 다음 시작부터 적용돼요')}
  }
  updateTempo();
};
// 누르면 1씩, 꾹 누르고 있으면 계속 바뀌어요
function holdRepeat(btn,d){
  let t1=0,t2=0,n=0;
  const stop=()=>{clearTimeout(t1);clearInterval(t2)};
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();stop();n=0;bump(d);
    t1=setTimeout(()=>{t2=setInterval(()=>{n++;bump(n>15?d*5:d)},70)},380);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
  btn.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bump(d)}});
}

// 터치는 touchstart로 바로 받아요 (손가락이 닿는 순간, 여러 손가락 동시에). 마우스는 mousedown.
[['L',padL],['R',padR]].forEach(([h,p])=>{
  p.addEventListener('touchstart',e=>{e.preventDefault();for(let i=0;i<e.changedTouches.length;i++)hit(h,e.timeStamp)},{passive:false});
  p.addEventListener('mousedown',e=>{e.preventDefault();hit(h,e.timeStamp)});
  p.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('keydown',e=>{
  if(e.repeat||e.target.tagName==='INPUT'||!$('#sheet').hidden)return;
  const k=e.key.toLowerCase();
  if(k==='f'||k==='d'||k==='arrowleft'){e.preventDefault();hit('L',e.timeStamp)}
  else if(k==='j'||k==='k'||k==='arrowright'){e.preventDefault();hit('R',e.timeStamp)}
  else if(k===' '){e.preventDefault();$('#btnPlay').click()}
  else if(k==='arrowup'){e.preventDefault();bump(1)}
  else if(k==='arrowdown'){e.preventDefault();bump(-1)}
});

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfReady=null;
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('도구를 내려받지 못했어요. 인터넷 연결을 확인해 주세요'));document.head.appendChild(s)});
function ensurePdf(){
  if(!pdfReady)pdfReady=(async()=>{
    await loadScript(PDFJS+'pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
    await loadScript('pdf-import.js?v=3');
    return window.pdfjsLib;
  })().catch(err=>{pdfReady=null;throw err});
  return pdfReady;
}
async function importPdf(f){
  closeSheet();finish(false);hideResult();
  overlay('PDF 악보를 읽는 중…',true);
  try{
    const lib=await ensurePdf();
    const res=await window.DrumPdf.parseDrumPdf(lib,new Uint8Array(await f.arrayBuffer()),{keepDoc:true,onProgress:(p,n)=>overlay(`PDF 악보를 읽는 중… ${p}/${n}쪽`,true)});
    overlay('');
    const hasNotes=res.song.bars.some(b=>Object.keys(b).some(k=>KIT[k]));
    if(!hasNotes){if(res.doc)res.doc.destroy();toast('이 PDF에서 드럼 악보를 찾지 못했어요. 스캔·사진 PDF는 아직 못 읽어요');return}
    if(!res.song.title||res.song.title==='불러온 악보')res.song.title=f.name.replace(/\.[^.]+$/,'');
    try{parseSong(res.song)}catch(err){if(res.doc)res.doc.destroy();toast('악보 변환 오류: '+err.message);return}
    openReview(res); // 바로 연습하지 않고 원본과 비교·수정부터
    toast(`${res.measures}마디를 읽었어요${res.repeats?` (도돌이표 펼쳐서 ${res.played}마디)`:''}${res.warnings.length?` · ${res.warnings.length}곳은 원본과 비교해 주세요`:''}`);
  }catch(err){overlay('');toast('PDF를 읽지 못했어요: '+(err&&err.message||err))}
}
/* ---------- PDF 확인·수정 화면 ----------
   마디마다 원본 PDF 조각, 읽은 결과 악보, 고치기 격자를 나란히 보여줘요.
   도돌이표로 반복되는 마디는 같은 원본 마디라서 한 곳을 고치면 함께 바뀌어요. */
const RV_LANES=[['cr','크래시'],['hh','하이햇'],['rd','라이드'],['t1','하이탐'],['t2','미드탐'],['sd','스네어'],['ft','플로어탐'],['bd','킥']];
const RV_CYCLE={hh:['-','x','o','X'],bd:['-','x'],sd:['-','x','X','g']};
const RV_SHOW={x:'●',X:'>',o:'○',O:'○',g:'(·)'};
let RV=null;
function laneArr(bar,inst){const g=bar.grid||16,s=String(bar[inst]||'').replace(/[\s|]/g,''),a=[];for(let k=0;k<g;k++){const c=s[k];a.push(c&&c!=='.'?c:'-')}return a}
function setLane(bar,inst,arr){if(arr.every(c=>c==='-')){delete bar[inst];return}const per=(bar.grid||16)/4;bar[inst]=arr.join('').match(new RegExp(`.{1,${per}}`,'g')).join(' ')}
function rvEffBpm(i){for(let k=i;k>=0;k--)if(RV.draft.bars[k].bpm)return RV.draft.bars[k].bpm;return RV.draft.bpm||100}
// 같은 원본 마디를 가리키는 다른 연주 마디에 그대로 복사
function rvSyncTwins(i){
  const src=RV.res.sources,b=RV.draft.bars[i];
  src.forEach((s,k)=>{
    if(k===i||s.printed!==src[i].printed)return;
    const t=RV.draft.bars[k];t.grid=b.grid;
    for(const [inst] of RV_LANES){if(b[inst])t[inst]=b[inst];else delete t[inst]}
  });
}

  const i=RV.i,s=RV.res.sources[i],bar=RV.draft.bars[i],n=RV.draft.bars.length;
  $('#rvPos').textContent=`${i+1} / ${n}`;
  const fl=$('#rvFlag');fl.hidden=!(s.fuzzy||s.empty);fl.className='rv-flag'+(s.fuzzy?'':' info');fl.textContent=s.fuzzy?'박자 확인 필요':'빈 마디';
  $('#rvSrcCap').textContent=`원본 PDF · ${s.page}쪽 · 악보의 ${s.printed}마디${s.copied?' (반복 기호로 복사)':''}`;
  $('#rvGrid').value=String(bar.grid||16);$('#rvBpm').value=rvEffBpm(i);
  rvDrawResult();rvDrawGrid();rvDrawSource(i);
}
function rvDrawResult(){
  const i=RV.i,bar=JSON.parse(JSON.stringify(RV.draft.bars[i]));delete bar.label;
  const svg=$('#rvSvg');
  try{
    const P=buildKit(parseSong({title:'',bpm:rvEffBpm(i),bars:[{...bar,bpm:rvEffBpm(i)}]}));
    const w=Math.max(300,Math.floor(svg.parentElement.clientWidth-20)),m=kitMarkup(P,w,{bare:true,barNo:()=>RV.res.sources[i].printed});
    svg.setAttribute('viewBox',`0 0 ${m.W} ${m.H}`);svg.innerHTML=m.h;
  }catch(err){svg.innerHTML=''}
}
function rvDrawGrid(){
  const bar=RV.draft.bars[RV.i],g=bar.grid||16,per=g/4;
  let t=`<table style="--cols:${g}"><tbody>`;
  for(const [inst,name] of RV_LANES){
    const a=laneArr(bar,inst);
    t+=`<tr><th>${name}</th>`+a.map((c,k)=>{const cls=[k%per===0?'beat':'',c==='-'?'':(/[A-Z]/.test(c)&&inst!=='bd'?'acc':(c==='g'||c==='o'?'soft':'on'))].join(' ');
      return `<td class="${cls}" data-l="${inst}" data-k="${k}" aria-label="${name} ${k+1}칸">${c==='-'?'':(RV_SHOW[c]||'●')}</td>`}).join('')+'</tr>';
  }
  $('#rvGridBox').innerHTML=t+'</tbody></table>';
}
async function rvDrawSource(i){
  const s=RV.res.sources[i],box=$('#rvSrc'),doc=RV.res.doc;
  if(!doc||!s.page){box.innerHTML='<p>원본을 표시할 수 없어요</p>';return}
  const scale=2.5;let pc=RV.pages.get(s.page);
  try{
    if(!pc){
      const page=await doc.getPage(s.page),vp=page.getViewport({scale});
      pc=document.createElement('canvas');pc.width=Math.ceil(vp.width);pc.height=Math.ceil(vp.height);
      const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,pc.height);
      await page.render({canvasContext:g,viewport:vp}).promise;
      if(!RV)return;
      RV.pages.set(s.page,pc);
      if(RV.pages.size>2){const k=RV.pages.keys().next().value,old=RV.pages.get(k);old.width=old.height=0;RV.pages.delete(k)} // 폰 메모리 아끼기: 최근 2쪽만
    }
  }catch(err){box.innerHTML='<p>원본을 그리지 못했어요</p>';return}
  if(!RV||RV.i!==i)return;
  const x0=Math.max(0,s.L-8),x1=s.R+8,y0=Math.max(0,s.top-s.sp*9),y1=s.bottom+s.sp*7;
  const w=Math.round((x1-x0)*scale),h=Math.round((y1-y0)*scale);
  box.innerHTML='<canvas id="rvCanvas"></canvas>';
  const cv=$('#rvCanvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(pc,x0*scale,y0*scale,w,h,0,0,w,h);
}
function rvEdit(fn){fn(RV.draft.bars[RV.i]);rvSyncTwins(RV.i);rvDrawResult();rvDrawGrid()}
$('#review').addEventListener('click',e=>{
  if(!RV)return;
  const cell=e.target.closest('td[data-l]');
  if(cell){
    const inst=cell.dataset.l,k=+cell.dataset.k,cyc=RV_CYCLE[inst]||['-','x','X'];
    rvEdit(bar=>{const a=laneArr(bar,inst),c=a[k],idx=cyc.indexOf(c);a[k]=cyc[(idx+1)%cyc.length]||'-';setLane(bar,inst,a)});
    return;
  }
  const a=e.target.closest('[data-rv]');if(!a)return;
  const n=RV.draft.bars.length;
  switch(a.dataset.rv){
    case 'prev':RV.i=(RV.i-1+n)%n;rvShow();break;
    case 'next':RV.i=(RV.i+1)%n;rvShow();break;
    case 'flag':{const f=RV.flags.find(k=>k>RV.i);RV.i=f!=null?f:RV.flags[0];rvShow();break}
    case 'clear':rvEdit(bar=>{for(const [inst] of RV_LANES)delete bar[inst]});break;
    case 'copy':if(RV.i>0)rvEdit(bar=>{const p=RV.draft.bars[RV.i-1];bar.grid=p.grid;for(const [inst] of RV_LANES){if(p[inst])bar[inst]=p[inst];else delete bar[inst]}});break;
    case 'cancel':closeReview();toast('PDF 불러오기를 취소했어요');break;
    case 'done':{const song=RV.draft;closeReview();if(loadKit(song,true))toast(`'${song.title}' 악보를 저장하고 열었어요`);break}
  }
});
$('#review').addEventListener('change',e=>{
  if(!RV)return;
  if(e.target.id==='rvGrid'){
    const ng=+e.target.value;
    rvEdit(bar=>{const og=bar.grid||16;if(og===ng)return;const lanes={};
      for(const [inst] of RV_LANES){const a=laneArr(bar,inst),b=Array(ng).fill('-');a.forEach((c,k)=>{if(c!=='-'){const nk=Math.round(k*ng/og);if(nk<ng)b[nk]=c}});lanes[inst]=b}
      bar.grid=ng;for(const [inst] of RV_LANES)setLane(bar,inst,lanes[inst])});
  }else if(e.target.id==='rvBpm'){
    const v=clamp(+e.target.value||0,30,300);RV.draft.bars[RV.i].bpm=v;e.target.value=v;rvDrawResult();
  }
});
$('#fileKit').addEventListener('change',async e=>{

      `<div class="seg" style="align-self:flex-start">${Object.entries(POSTURES).map(([v,l])=>`<button data-posture="${v}" aria-pressed="${S.posture===v}">${l}</button>`).join('')}</div>`+
      `<div class="res-actions"><button class="btn" data-act="skipcal">그냥 시작</button><button class="btn primary" data-act="calib">보정하기</button></div>`;
    el.querySelectorAll('[data-posture]').forEach(x=>x.addEventListener('click',()=>{

/* ---------- 초견 패턴 공유 ----------
   지금 보고 있는 초견을 링크 하나로: 링크의 # 뒤에 패턴(칸마다 손·악센트·플램)과 템포를 담아요.
   서버에 아무것도 저장하지 않고, 링크를 연 친구의 폰에서 같은 악보로 열려요. */
function encodeShare(P){
  // 칸: '' 쉼표, 'R'/'L' 침, 뒤에 '>' 악센트, 앞에 소문자 l/r 플램 꾸밈음
  const cells=P.slots.map(s=>s?(s.g?s.g.toLowerCase():'')+s.h+(s.acc?'>':''):'');
  const json=JSON.stringify({v:1,l:P.lvl||0,s:P.sub,b:P.bars,t:S.bpm,p:cells.join(',')});
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeShare(code){
  const json=decodeURIComponent(escape(atob(code.replace(/-/g,'+').replace(/_/g,'/'))));
  const d=JSON.parse(json);
  if(d.v!==1||![1,2,3,4].includes(d.s)||![1,2].includes(d.b))throw new Error('지원하지 않는 링크');
  const cells=String(d.p).split(',');
  if(cells.length!==d.s*4*d.b)throw new Error('패턴 길이가 맞지 않아요');
  const slots=cells.map(c=>{
    const m=c.match(/^([lr]?)([RL])(>?)$/);if(!c)return null;if(!m)throw new Error('알 수 없는 칸');
    return {h:m[2],acc:!!m[3],g:m[1]?m[1].toUpperCase():undefined};
  });
  const L=LV.find(x=>x.id===d.l);
  return {P:{name:`공유 받은 초견${L?' · '+L.desc:''}`,sub:d.s,bars:d.b,slots,gen:true,lvl:d.l||S.level,shared:true},bpm:clamp(+d.t||80,30,220)};
}
async function sharePattern(){
  const P=cur.pattern;if(!P||!P.slots)return;
  const url=location.origin+location.pathname+'#share='+encodeShare(P);
  const L=LV.find(x=>x.id===P.lvl),text=`루디트레이너 초견 같이 쳐봐요 · ${L?L.desc:'초견'} · ${S.bpm} BPM`;
  if(navigator.share){try{await navigator.share({title:'루디트레이너 초견',text,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('공유 링크를 복사했어요. 친구에게 붙여넣어 보내세요')}
  catch(e){openSheet('share',head('공유 링크')+`<p class="note">아래 링크를 길게 눌러 복사해 보내세요.</p><textarea readonly style="width:100%;height:96px;font:12px var(--f-latin);border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)">${esc(url)}</textarea>`,b=>{const t=b.querySelector('textarea');t.focus();t.select()})}
}
$('#btnShare').addEventListener('click',sharePattern);
function openSharedFromLink(){
  const m=location.hash.match(/^#share=([A-Za-z0-9_-]+)$/);if(!m)return false;
  try{
    const {P,bpm}=decodeShare(m[1]);
    S.mode='read';S.bpm=bpm;if(P.lvl)S.level=P.lvl;applyMode();setPattern(P);
    toast('친구가 공유한 초견이에요. 시작을 눌러 쳐보세요');
  }catch(err){toast('공유 링크를 열 수 없어요: '+err.message)}
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  return true;
}
window.addEventListener('hashchange',()=>{if(openSharedFromLink())finish(false)});
